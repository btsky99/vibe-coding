name: Build & Release

on:
  push:
    branches: [main]
    # [WHY] main 푸시마다 설치본 풀빌드(윈도우 EXE + 맥 DMG, 10~15분)가 돌면
    #   문서·독립 스크립트만 고쳐도 새 릴리즈가 발행되고 사용자에게 자동 전파된다.
    #   순수 .py 변경은 경량 소스 업데이트 채널(soft_updater)이 커밋 SHA만 보고 처리하므로
    #   풀빌드가 필요 없다 — 풀빌드는 의존성/번들 구성이 바뀔 때만 의미가 있다.
    # [불변식] paths-ignore는 **푸시의 모든 변경 파일이** 아래 패턴에 걸릴 때만 워크플로를 건너뛴다.
    #   .py 하나라도 섞이면 정상적으로 빌드가 돈다 → 코드 변경이 조용히 누락될 위험은 없다.
    # [주의] 앱이 실행 시점에 읽는 것은 여기에 넣지 말 것. scripts/remote/는 관리자가 손으로
    #   돌리는 독립 PowerShell 스크립트라 앱 번들과 무관하다(docs/REMOTE_CONTROL.md).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/remote/**'
  workflow_dispatch:  # 수동 트리거 허용 (긴급 빌드 또는 테스트용)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # [2026-07-24] macOS 잡이 같은 버전을 쓰도록 스텝 출력을 잡 출력으로 승격.
    #   버전 확정(태그 중복 시 자동 bump)은 이 잡에서만 수행한다 — 두 잡이 각자
    #   bump하면 서로 다른 버전이 나와 릴리즈가 갈라진다.
    outputs:
      ver: ${{ steps.version.outputs.ver }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      # [2026-06-11] Node 20 액션 deprecation 대응 — 2026-06-16부터 GitHub이 Node 24 강제.
      # 구버전 메이저(checkout@v4 등)는 그 시점에 빌드 깨질 수 있어 Node 24 지원 메이저로 일괄 상향.
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # [2026-07-15] 3.11 → 3.13 승격 — 로컬 EXE 빌드가 3.13.2로 검증됨(pyinstaller
          # 6.20, smoke test 7/7). 로컬 검증 환경과 출고물의 런타임 간극 제거가 목적.
          # [함정] psycopg2-binary는 2.9.10부터 cp313 휠 제공 — requirements.txt 핀 동기 필수.
          python-version: "3.13"

      - name: Install Python dependencies
        # [2026-07-15] uv 도입 — pip 대비 의존성 해석/설치 수배 빠름 (2026-07 리서치 도입 결정).
        # --system: CI 러너의 setup-python 환경에 직접 설치 (venv 불필요). 실패 시 pip 폴백.
        run: |
          pip install uv
          uv pip install --system -r .ai_monitor/requirements.txt || pip install -r .ai_monitor/requirements.txt

      - name: Lint & syntax check (Python)
        run: |
          pip install ruff
          python -m py_compile .ai_monitor/server.py .ai_monitor/boot.py .ai_monitor/soft_updater.py
          ruff check .ai_monitor/server.py .ai_monitor/boot.py .ai_monitor/soft_updater.py --select E9,F821,F823

      - name: Pre-build verification (Phase 1 - source check)
        # [2026-03-27 Claude] 빌드 전 검증 Phase 1 — Python 의존성, 버전, 구문, import 사전 확인
        # 프론트엔드/PTY 빌드(~5분) 전에 Python 측 문제를 먼저 잡아 빌드 시간 낭비 방지
        run: python scripts/build_verify.py --ci --phase pre

      - name: Harness verification
        run: python scripts/harness_verify.py --ci

      - name: Run tests (pytest gate)
        # [2026-07-09 Claude] 전략 #1 — 릴리즈를 pytest로 게이트한다.
        # 그동안 build-release는 lint/harness만 보고 단위/통합 테스트를 안 돌려,
        # tasks_api 시그니처 드리프트 같은 회귀가 조용히 썩고(테스트 4개 미검출),
        # 업데이트/_MEI 경로 회귀("Failed to load Python DLL")가 CI가 아닌 프로덕션에서 발견됐다.
        # tests/office 는 실행 중 서버가 필요(비격리)해 제외 — 나머지는 전부 hermetic(외부의존 0, 수초).
        # 실패 시 프론트/EXE 빌드(~5분) 전에 즉시 중단해 시간 낭비 없이 회귀를 잡는다.
        run: |
          pip install pytest
          python -m pytest tests --ignore=tests/office -q

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build frontend
        run: |
          cd .ai_monitor/vibe-view
          npm ci
          npm run build

      - name: Resolve version (auto-bump patch if tag already exists)
        id: version
        run: |
          # _version.py에서 기준 버전 읽기
          $base = python -c "exec(open('.ai_monitor/_version.py', encoding='utf-8').read()); print(__version__)"
          $parts = $base -split "\."
          $major = $parts[0]; $minor = $parts[1]; $patch = [int]$parts[2]

          # 동일 태그가 이미 GitHub에 존재하면 패치 버전을 자동 증가
          # (버전 미변경 커밋이 push 됐을 때 릴리스 중복 방지)
          $ver = $base
          while ($true) {
            $checkTag = "v$ver"
            gh release view $checkTag > $null 2>&1
            if ($LASTEXITCODE -ne 0) { break }   # 이 태그가 없으면 사용 확정
            $patch++
            $ver = "$major.$minor.$patch"
          }

          # 버전이 변경된 경우 → _version.py 업데이트 (빌드가 새 버전명을 쓰도록 로컬 반영).
          # [전략 #2a 안전가드] main에 커밋/push는 main push 이벤트에서만 — feat 브랜치
          #   workflow_dispatch(테스트)에서 브랜치가 오염되거나 잘못 push되는 걸 막는다.
          if ($ver -ne $base) {
            Set-Content -Path ".ai_monitor/_version.py" -Value "__version__ = `"$ver`""
            if ($env:GITHUB_REF -eq 'refs/heads/main') {
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git config user.name "github-actions[bot]"
              git add .ai_monitor/_version.py
              git commit -m "chore(release): auto-bump version to v$ver [skip ci]"

              # [🔴 push 실패를 삼키지 말 것 — 2026-08-11 실제 사고]
              #   빌드가 도는 10~20분 사이에 사람이 커밋을 더 push하면 이 push는
              #   non-fast-forward로 거부된다. 그런데 스텝 끝의 `exit 0`이 실패를 덮어
              #   릴리즈는 v3.7.333으로 나가고 저장소의 _version.py는 332로 남았다.
              #   → 개발 PC가 배포본보다 낮은 버전을 들고 있게 되고, 원인이 어디에도
              #     드러나지 않는다. rebase 후 재시도하고, 그래도 실패하면 크게 알린다.
              $pushed = $false
              foreach ($try in 1..3) {
                git push 2>&1 | Write-Host
                if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
                Write-Host "push 거부 — 최신 main을 받아 재시도 ($try/3)"
                git pull --rebase origin main 2>&1 | Write-Host
              }
              if ($pushed) {
                Write-Host "Auto-bumped(main): $base -> $ver"
              } else {
                # 릴리즈 자체는 이미 유효하므로 빌드를 실패시키지 않는다. 다만 조용히
                # 넘어가면 같은 어긋남이 반복되므로 경고로 남긴다(Actions 요약에 표시).
                Write-Host "::warning::_version.py 를 $ver 로 push하지 못했다. 저장소는 $base 로 남아 있으니 로컬에서 맞춰야 한다."
              }
            } else {
              Write-Host "Auto-bumped(branch, no push): $base -> $ver"
            }
          }

          echo "tag=v$ver" >> $env:GITHUB_OUTPUT
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Final version: v$ver"
          exit 0  # gh release view가 non-zero 반환해도 스텝 성공 처리
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find winpty binaries path
        id: winpty
        run: |
          import winpty, os
          wp = os.path.dirname(winpty.__file__)
          print(f"path={wp}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"path={wp}\n")
        shell: python

      - name: Sync icons and assets
        run: |
          copy assets\vibe_coding_icon.ico .ai_monitor\bin\app_icon.ico /y
          copy assets\vibe_coding_icon.ico .ai_monitor\bin\vibe_final.ico /y
        shell: cmd

      - name: Download PostgreSQL portable
        # 설치버전에 포함할 PostgreSQL 포터블 바이너리 (bin/lib/share만 추출)
        # PG_VERSION 환경변수로 버전 관리 — 보안 패치 시 이 값만 변경하면 됨
        run: |
          $pgVersion = if ($env:PG_PORTABLE_VERSION) { $env:PG_PORTABLE_VERSION } else { "17.4-1" }
          $pgUrl = "https://get.enterprisedb.com/postgresql/postgresql-$pgVersion-windows-x64-binaries.zip"
          $zipPath = "$env:TEMP\pgsql.zip"
          Write-Host "Downloading PostgreSQL portable..."
          Invoke-WebRequest -Uri $pgUrl -OutFile $zipPath -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\pgsql_extract" -Force
          # bin, lib, share 만 복사 (pgAdmin, doc 등 제외)
          $dest = ".ai_monitor\bin\pgsql"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "$env:TEMP\pgsql_extract\pgsql\bin" -Destination "$dest\bin" -Recurse -Force
          Copy-Item -Path "$env:TEMP\pgsql_extract\pgsql\lib" -Destination "$dest\lib" -Recurse -Force
          Copy-Item -Path "$env:TEMP\pgsql_extract\pgsql\share" -Destination "$dest\share" -Recurse -Force
          Write-Host "PostgreSQL portable ready at $dest"
          Remove-Item $zipPath -Force
        shell: pwsh

      - name: Build PTY server (node-pty)
        # [2026-03-22 Claude] node-pty 마이크로서비스 빌드
        # 1. npm ci로 네이티브 모듈(node-pty) 빌드
        # 2. 포터블 Node.js 런타임을 함께 번들하여 사용자 PC의 Node 버전 불일치 방지
        #    CI의 Node 20으로 빌드된 네이티브 모듈은 같은 Node 20 런타임이 필요하므로
        #    node.exe를 pty-server/ 디렉터리에 복사하여 server.py가 이를 사용하도록 함
        run: |
          cd .ai_monitor/pty-server
          npm ci
          # 현재 CI Node.js 런타임을 pty-server에 복사 (네이티브 모듈 ABI 호환 보장)
          cp "$(which node)" ./node.exe
        shell: bash

      # [2026-03-24] 배포 범용화: 개발 전용 파일 번들 제거
      # 제거됨: .gemini/skills, .claude/skills, scripts, GEMINI.md, CLAUDE.md, RULES.md
      # 설치 버전은 대시보드 GUI + 터미널 + PostgreSQL만 포함

      - name: Pre-build verification (Phase 2 - final gate)
        # [2026-03-27 Claude] 최종 빌드 게이트 — 프론트엔드, PTY, winpty, 에셋 전부 검증
        # 이 단계를 통과해야만 PyInstaller EXE 빌드가 시작됨
        run: python scripts/build_verify.py --ci --phase post

      - name: Build exe
        # [2026-03-21 Claude] 경로 수정: server.py가 _MEIPASS/vibe-view/dist/ 에서 프론트엔드를 찾으므로
        # --add-data 대상도 vibe-view/dist로 맞춰야 함. 이전: dist → "Not Found" 에러 발생.
        # [2026-03-22 Claude] shell: bash 사용 — cmd에서 %APPDATA%가 CI 러너 경로로
        # 확장되어 runtime-tmpdir이 무효화되는 문제 방지. bash는 %VAR%를 확장하지 않음.
        shell: bash
        run: |
          cd .ai_monitor
          WINPTY="${{ steps.winpty.outputs.path }}"
          # [2026-03-24] 배포 범용화: 개발 전용 파일 제거 (skills, scripts, .md 지침서)
          # [2026-07-04 A안] entry server.py → boot.py 전환 — 앱 .py는 관리 체크아웃에서 runpy 실행.
          #   _appseed/*는 오프라인 최초부팅/게이트 폴백용 소스 스냅샷 (spec datas와 1:1 동기).
          #   hidden-import 목록은 boot.py `if False:` 블록 ↔ vibe-coding.spec hiddenimports와 3중 동기 의무
          #   (과거사고 v3.7.215~218: 한쪽만 갱신 → 설치 EXE ImportError).
          # [전략 #2a onedir] --onefile 제거 → onedir(폴더+_internal). --runtime-tmpdir도 제거
          #   (추출 자체가 없어 _MEI/좀비/DLL로드실패 버그 클래스 소멸). --name은 .iss MyOneDirName
          #   (vibe-coding-v<ver>)과 일치시켜 인스톨러가 dist/<name>/ 폴더를 찾게 한다.
          pyinstaller --noconsole \
            --name "vibe-coding-v${{ steps.version.outputs.ver }}" \
            --icon bin/vibe_final.ico \
            --add-data "src;src" \
            --add-data "bin;bin" \
            --add-data "vibe-view/dist;vibe-view/dist" \
            --add-data "api;api" \
            --add-data "infra;infra" \
            --add-data "pty-server;pty-server" \
            --add-data "_version.py;." \
            --add-data "updater.py;." \
            --add-data "lan_bridge.py;." \
            --add-data "../soft_manifest.json;." \
            --add-data "server.py;_appseed/.ai_monitor" \
            --add-data "lan_bridge.py;_appseed/.ai_monitor" \
            --add-data "boot.py;_appseed/.ai_monitor" \
            --add-data "soft_updater.py;_appseed/.ai_monitor" \
            --add-data "updater.py;_appseed/.ai_monitor" \
            --add-data "_version.py;_appseed/.ai_monitor" \
            --add-data "api;_appseed/.ai_monitor/api" \
            --add-data "src;_appseed/.ai_monitor/src" \
            --add-data "infra;_appseed/.ai_monitor/infra" \
            --add-data "../scripts;_appseed/scripts" \
            --add-data "../soft_manifest.json;_appseed" \
            --add-binary "$WINPTY/winpty.dll;winpty" \
            --add-binary "$WINPTY/winpty-agent.exe;winpty" \
            --add-binary "$WINPTY/conpty.dll;winpty" \
            --add-binary "$WINPTY/OpenConsole.exe;winpty" \
            --hidden-import websockets \
            --hidden-import winpty \
            --hidden-import psycopg2 \
            --hidden-import _version \
            --hidden-import updater \
            --hidden-import soft_updater \
            --hidden-import runpy \
            --hidden-import urllib.request \
            --hidden-import fastembed \
            --hidden-import onnxruntime \
            --hidden-import tokenizers \
            --hidden-import webview \
            --hidden-import clr \
            --hidden-import watchdog \
            --hidden-import dotenv \
            --hidden-import rich \
            --hidden-import telegram \
            --hidden-import win32com \
            --hidden-import win32api \
            --hidden-import win32con \
            --hidden-import pythoncom \
            --hidden-import numpy \
            --hidden-import filelock \
            --hidden-import PIL \
            --collect-data fastembed \
            boot.py

      - name: Build exe (console)
        # [2026-03-21 Claude] noconsole 빌드와 동일한 경로 수정 적용
        # [2026-03-22 Claude] shell: bash — %APPDATA% 리터럴 보존을 위해 cmd → bash 변경
        shell: bash
        run: |
          cd .ai_monitor
          WINPTY="${{ steps.winpty.outputs.path }}"
          # [2026-03-24] 배포 범용화: noconsole 빌드와 동일하게 개발 전용 파일 제거
          # [2026-07-04 A안] noconsole 빌드와 동일 — entry boot.py + _appseed + hidden-import 3중 동기.
          pyinstaller --onefile --console \
            --name "vibe-coding-console-${{ steps.version.outputs.ver }}" \
            --icon bin/vibe_final.ico \
            --runtime-tmpdir '%APPDATA%\VibeCoding\runtime' \
            --add-data "src;src" \
            --add-data "bin;bin" \
            --add-data "vibe-view/dist;vibe-view/dist" \
            --add-data "api;api" \
            --add-data "infra;infra" \
            --add-data "pty-server;pty-server" \
            --add-data "_version.py;." \
            --add-data "updater.py;." \
            --add-data "lan_bridge.py;." \
            --add-data "../soft_manifest.json;." \
            --add-data "server.py;_appseed/.ai_monitor" \
            --add-data "lan_bridge.py;_appseed/.ai_monitor" \
            --add-data "boot.py;_appseed/.ai_monitor" \
            --add-data "soft_updater.py;_appseed/.ai_monitor" \
            --add-data "updater.py;_appseed/.ai_monitor" \
            --add-data "_version.py;_appseed/.ai_monitor" \
            --add-data "api;_appseed/.ai_monitor/api" \
            --add-data "src;_appseed/.ai_monitor/src" \
            --add-data "infra;_appseed/.ai_monitor/infra" \
            --add-data "../scripts;_appseed/scripts" \
            --add-data "../soft_manifest.json;_appseed" \
            --add-binary "$WINPTY/winpty.dll;winpty" \
            --add-binary "$WINPTY/winpty-agent.exe;winpty" \
            --add-binary "$WINPTY/conpty.dll;winpty" \
            --add-binary "$WINPTY/OpenConsole.exe;winpty" \
            --hidden-import websockets \
            --hidden-import winpty \
            --hidden-import psycopg2 \
            --hidden-import _version \
            --hidden-import updater \
            --hidden-import soft_updater \
            --hidden-import runpy \
            --hidden-import urllib.request \
            --hidden-import fastembed \
            --hidden-import onnxruntime \
            --hidden-import tokenizers \
            --hidden-import webview \
            --hidden-import clr \
            --hidden-import watchdog \
            --hidden-import dotenv \
            --hidden-import rich \
            --hidden-import telegram \
            --hidden-import win32com \
            --hidden-import win32api \
            --hidden-import win32con \
            --hidden-import pythoncom \
            --hidden-import numpy \
            --hidden-import filelock \
            --hidden-import PIL \
            --collect-data fastembed \
            boot.py

      - name: Build sub-window EXEs
        # server.py frozen 모드에서 Python 서브프로세스 대신 이 EXE들을 직접 실행.
        # vibe-dashboard.exe → {app}\ 에 설치됨.
        # [2026-03-22] vibe-graph.exe 제거 (지식그래프 삭제)
        run: |
          cd .ai_monitor
          pyinstaller --onefile --noconsole ^
            --name vibe-dashboard ^
            --icon bin/vibe_final.ico ^
            --add-data "bin;bin" ^
            --hidden-import PySide6.QtWebEngineWidgets ^
            --hidden-import PySide6.QtWebEngineCore ^
            dashboard_window.py
          REM vibe-kanban.exe 제거됨 — B안 통합: kanban은 vibe-dashboard.exe kanban 탭으로 실행
        shell: cmd

      - name: Bundle Node.js and npm for first-install AI tools
        # Stage this after PyInstaller so Node is included once, by the installer.
        shell: pwsh
        run: |
          $nodeVersion = "22.16.0"
          $archive = "$env:TEMP\node-portable.zip"
          $extract = "$env:TEMP\node-portable"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $source = Join-Path $extract "node-v$nodeVersion-win-x64"
          $dest = ".ai_monitor\bin\nodejs"
          if (Test-Path $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          Copy-Item -Path $source -Destination $dest -Recurse -Force
          & "$dest\node.exe" --version
          & "$dest\npm.cmd" --version

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Build installer
        run: |
          REM [onedir] .iss가 MyOneDirName(vibe-coding-v<ver>)으로 onedir 폴더를 참조하므로
          REM MyAppSrcExe 오버라이드 불필요(제거). MyAppVersion만 전달.
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" "vibe-coding-setup.iss" /DMyAppVersion="${{ steps.version.outputs.ver }}"
        shell: cmd

      # [브랜치 검증용] onedir/인스톨러가 실제로 빌드되는지 feat 브랜치 workflow_dispatch로
      #   검증하되 릴리즈는 안 하도록, 빌드 산출물(setup)을 워크플로 아티팩트로 올린다.
      #   main push에서는 아래 Create Release가 정식 배포하므로 중복이지만 무해.
      - name: Upload installer artifact (branch verification)
        uses: actions/upload-artifact@v4
        with:
          name: vibe-coding-setup-${{ steps.version.outputs.ver }}
          path: .ai_monitor/dist/vibe-coding-setup-${{ steps.version.outputs.ver }}.exe
          if-no-files-found: error

      - name: Create Release
        # [전략 #2a 안전가드] main push에서만 정식 릴리즈. feat 브랜치 workflow_dispatch(테스트)에서는
        #   실행하지 않아 미완성 onedir이 실사용자에게 배포되는 사고를 막는다.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Vibe Coding ${{ steps.version.outputs.tag }}"
          body: |
            자동 빌드 릴리스
            - Commit: ${{ github.sha }}
            - 빌드 시간: ${{ github.event.head_commit.timestamp }}
          files: |
            .ai_monitor/dist/vibe-coding-setup-${{ steps.version.outputs.ver }}.exe

  # ═══════════════════════════════════════════════════════════════════
  #  macOS 빌드 — .app 번들 + .dmg
  # ═══════════════════════════════════════════════════════════════════
  # [WHY 별도 잡] PyInstaller는 크로스 컴파일이 불가능하다 — macOS 산출물은 반드시
  #   macOS 러너에서 빌드해야 한다.
  # [WHY needs: build] 버전 확정(태그 중복 시 자동 bump + _version.py 커밋)은 윈도우
  #   잡이 단독 수행한다. 두 잡이 각자 bump하면 버전이 갈라진다. 여기서는 결과만 받아
  #   쓰고, 윈도우가 만든 같은 태그의 릴리즈에 .dmg를 덧붙인다.
  # [실패 격리] 이 잡이 실패해도 윈도우 릴리즈는 이미 발행된 채로 남는다.
  build-mac:
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6
        with:
          # 윈도우 잡이 _version.py를 bump·push했을 수 있어 최신 main을 받는다.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Pin version from build job
        # [불변식] 산출물 파일명과 앱 내부 표기 버전은 반드시 일치해야 한다.
        #   checkout과 bump 사이의 레이스를 없애기 위해 확정값을 직접 기록한다.
        run: |
          echo '__version__ = "${{ needs.build.outputs.ver }}"' > .ai_monitor/_version.py
          cat .ai_monitor/_version.py

      - name: Install Python deps
        # requirements.txt의 pywinpty에는 sys_platform=='win32' 마커가 있어 여기선 건너뛴다.
        # (마커가 없던 시절엔 이 스텝에서 즉시 실패했다 — 2026-07-24 수정)
        run: |
          python -m pip install --upgrade pip
          pip install -r .ai_monitor/requirements.txt

      - name: Build frontend
        run: |
          cd .ai_monitor/vibe-view
          npm ci
          npm run build

      - name: Build PTY server (node-pty)
        # [플랫폼] 번들 런타임 파일명이 macOS는 `node`, Windows는 `node.exe`.
        #   infra/pty_process.py가 os.name으로 분기해 이 이름을 찾는다.
        run: |
          cd .ai_monitor/pty-server
          npm ci
          cp "$(which node)" ./node
          chmod +x ./node

      - name: Bundle PostgreSQL (Homebrew)
        # [WHY] EnterpriseDB는 macOS용 포터블 zip을 제공하지 않는다(Windows 전용).
        #   러너에 Homebrew로 설치한 뒤 필요한 산출물만 앱에 복사한다.
        # 🔴 [미검증 위험] Homebrew 바이너리는 /opt/homebrew/... 절대경로로 dylib을
        #   참조한다. Homebrew가 없는 사용자 맥에서 기동하려면 의존 dylib 동봉 +
        #   참조 재작성(install_name_tool)이 추가로 필요할 수 있다. 아래는 lib 동봉까지만
        #   수행하므로 실사용 맥에서 psql 기동 여부를 반드시 확인할 것.
        run: |
          brew install postgresql@17 || brew link --overwrite postgresql@17 || true
          PG_PREFIX="$(brew --prefix postgresql@17)"
          echo "PG_PREFIX=$PG_PREFIX"
          DEST=".ai_monitor/bin/pgsql"
          mkdir -p "$DEST"
          cp -R "$PG_PREFIX/bin"   "$DEST/"
          cp -R "$PG_PREFIX/lib"   "$DEST/"
          cp -R "$PG_PREFIX/share" "$DEST/"
          "$DEST/bin/psql" --version

      - name: Make .icns icon
        # [WHY] 리포에는 .ico/.png만 있고 .icns가 없다. macOS 기본 도구(sips/iconutil)로
        #   빌드 시점에 생성해 바이너리 에셋을 리포에 추가하지 않는다.
        run: |
          # [경로 주의] 아이콘 원본은 vibe-view/public/ 이다(빌드되면 dist/로 복사됨).
          #   dist/ 사본을 집으면 프론트 빌드 순서에 의존하게 되므로 원본을 명시한다.
          SRC=".ai_monitor/vibe-view/public/vibe_icon.png"
          if [ ! -f "$SRC" ]; then
            echo "::error::아이콘 원본을 찾을 수 없습니다: $SRC"
            exit 1
          fi
          echo "icon source: $SRC"
          file "$SRC"
          mkdir -p /tmp/icon.iconset
          # 🔴 [과거사고 2026-07-24] vibe_icon.png는 **확장자만 .png이고 실제 내용은 JPEG**다.
          #   sips는 입력 포맷을 그대로 이어받아 출력하므로("suffix should be jpg" 경고),
          #   iconset에 JPEG가 들어가 iconutil이 "Failed to generate ICNS"로 거부했다.
          #   -s format png 로 실제 PNG 인코딩을 강제해야 한다.
          # [규격] iconutil이 받는 이름은 16/32/128/256/512(+@2x)로 고정이다.
          #   icon_64x64.png 같은 비규격 이름이 섞여도 실패한다 — 64는 32@2x로 표현된다.
          for s in 16 32 128 256 512; do
            sips -s format png -z $s $s "$SRC" \
              --out "/tmp/icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -s format png -z $((s*2)) $((s*2)) "$SRC" \
              --out "/tmp/icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          ls /tmp/icon.iconset
          iconutil -c icns /tmp/icon.iconset -o /tmp/vibe.icns
          ls -la /tmp/vibe.icns

      - name: Build .app (PyInstaller)
        # [Windows 잡과의 차이 — 이 4가지가 핵심]
        #   1) --add-data 구분자가 ';'(Win)가 아니라 ':'(POSIX)
        #   2) winpty 바이너리 4종 및 clr/win32*/pythoncom hidden-import 전부 제외
        #      (macOS에 존재하지 않아 수집 단계에서 실패한다)
        #   3) --windowed 로 .app 번들 생성
        #   4) --noupx — UPX는 macOS(특히 arm64) 바이너리를 깨뜨린다
        run: |
          cd .ai_monitor
          pyinstaller --noconfirm --windowed \
            --name "vibe-coding-v${{ needs.build.outputs.ver }}" \
            --icon /tmp/vibe.icns \
            --osx-bundle-identifier "kr.pe.btsky.vibecoding" \
            --noupx \
            --add-data "src:src" \
            --add-data "bin:bin" \
            --add-data "vibe-view/dist:vibe-view/dist" \
            --add-data "api:api" \
            --add-data "infra:infra" \
            --add-data "pty-server:pty-server" \
            --add-data "_version.py:." \
            --add-data "updater.py:." \
            --add-data "lan_bridge.py:." \
            --add-data "../soft_manifest.json:." \
            --add-data "server.py:_appseed/.ai_monitor" \
            --add-data "lan_bridge.py:_appseed/.ai_monitor" \
            --add-data "boot.py:_appseed/.ai_monitor" \
            --add-data "soft_updater.py:_appseed/.ai_monitor" \
            --add-data "updater.py:_appseed/.ai_monitor" \
            --add-data "_version.py:_appseed/.ai_monitor" \
            --add-data "api:_appseed/.ai_monitor/api" \
            --add-data "src:_appseed/.ai_monitor/src" \
            --add-data "infra:_appseed/.ai_monitor/infra" \
            --add-data "../scripts:_appseed/scripts" \
            --add-data "../soft_manifest.json:_appseed" \
            --hidden-import websockets \
            --hidden-import psycopg2 \
            --hidden-import _version \
            --hidden-import updater \
            --hidden-import soft_updater \
            --hidden-import runpy \
            --hidden-import urllib.request \
            --hidden-import fastembed \
            --hidden-import onnxruntime \
            --hidden-import tokenizers \
            --hidden-import webview \
            --hidden-import watchdog \
            --hidden-import dotenv \
            --hidden-import rich \
            --hidden-import telegram \
            --hidden-import numpy \
            --hidden-import filelock \
            --hidden-import PIL \
            --hidden-import AppKit \
            --hidden-import PyObjCTools \
            --collect-data fastembed \
            boot.py
          ls -la dist/

      - name: Create .dmg
        # [WHY hdiutil] macOS 기본 제공 도구라 추가 의존성이 없다(create-dmg는 brew 설치 필요).
        #   Applications 심볼릭 링크를 넣어 드래그&드롭 설치 관례를 따른다.
        run: |
          cd .ai_monitor
          VER="${{ needs.build.outputs.ver }}"
          APP="dist/vibe-coding-v${VER}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::.app 번들이 없습니다: $APP"
            ls -la dist
            exit 1
          fi
          STAGE=/tmp/dmgstage
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Vibe Coding ${VER}" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/vibe-coding-${VER}.dmg"
          ls -lah dist/*.dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-coding-mac-${{ needs.build.outputs.ver }}
          path: .ai_monitor/dist/vibe-coding-${{ needs.build.outputs.ver }}.dmg
          if-no-files-found: error

      - name: Attach dmg to release
        # 윈도우 잡이 만든 같은 태그의 릴리즈에 .dmg를 덧붙인다(새 릴리즈 생성 아님).
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            .ai_monitor/dist/vibe-coding-${{ needs.build.outputs.ver }}.dmg
