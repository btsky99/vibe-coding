<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>서버 상태 — 파란이빨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<!--
  FILE: web/status/index.html
  DESCRIPTION: 서울 VPS 읽기 전용 상태판. /api/status 의 JSON을 그린다.
  [디자인] 메인 사이트(web/style.css)의 토큰을 그대로 따른다 — 별도 사이트처럼 보이면
    같은 서비스라는 인상이 깨진다. 다크 기본 + 라이트 대응, 유리질 카드, 파란 액센트.
  [WHY 단일 파일] 빌드 없이 nginx가 그대로 서빙한다. 상태판이 죽어서 상태를 못 보는
    상황을 피하려면 의존성이 적을수록 좋다.
  REVISION HISTORY:
  - 2026-08-08 Claude: 사이트 디자인 언어에 맞춰 전면 재작성.
-->
<style>
  :root{
    --bg-dark:#080a0f; --bg:#0c0e14;
    --card:rgba(20,24,35,.75); --card-solid:#131722; --card-hover:rgba(28,34,48,.85);
    --line:rgba(255,255,255,.08); --line-bright:rgba(255,255,255,.16);
    --fg:#f1f5f9; --fg-heading:#fff; --muted:#94a3b8;
    --accent:#2563eb; --accent-light:#60a5fa; --accent-glow:rgba(37,99,235,.25);
    --ok:#22c55e; --amber:#f59e0b; --red:#ef4444; --purple:#8b5cf6; --cyan:#06b6d4;
    --nav:rgba(12,14,20,.85);
    --shadow:0 20px 40px -15px rgba(0,0,0,.6);
    --radius-sm:10px; --radius-md:16px; --radius-lg:22px;
    --font-main:'Plus Jakarta Sans','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg-dark:#f0f4f8; --bg:#f8fafc;
      --card:rgba(255,255,255,.88); --card-solid:#fff; --card-hover:rgba(241,245,249,.95);
      --line:rgba(0,0,0,.08); --line-bright:rgba(0,0,0,.16);
      --fg:#1e293b; --fg-heading:#0f172a; --muted:#64748b;
      --nav:rgba(248,250,252,.88);
      --shadow:0 16px 32px -10px rgba(0,0,0,.08);
    }
  }
  :root[data-theme="light"]{
    --bg-dark:#f0f4f8; --bg:#f8fafc;
    --card:rgba(255,255,255,.88); --card-solid:#fff; --card-hover:rgba(241,245,249,.95);
    --line:rgba(0,0,0,.08); --line-bright:rgba(0,0,0,.16);
    --fg:#1e293b; --fg-heading:#0f172a; --muted:#64748b;
    --nav:rgba(248,250,252,.88);
    --shadow:0 16px 32px -10px rgba(0,0,0,.08);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--font-main);
    font-size:15px; line-height:1.6; font-weight:500;
    min-height:100vh;
    background-image:
      radial-gradient(900px 500px at 12% -8%, var(--accent-glow), transparent 60%),
      radial-gradient(700px 420px at 92% 4%, rgba(139,92,246,.12), transparent 60%);
    background-attachment:fixed;
  }

  /* ── 상단바 ── */
  .nav{
    position:sticky; top:0; z-index:20;
    background:var(--nav); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-in{
    max-width:920px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--fg-heading)}
  .brand .mark{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--purple));
    display:grid; place-items:center; font-size:15px;
    box-shadow:0 0 18px var(--accent-glow);
  }
  .brand b{font-weight:800; letter-spacing:-.02em; font-size:16px}
  .nav-sp{flex:1}
  .home{
    color:var(--muted); text-decoration:none; font-size:13px; font-weight:600;
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    transition:.18s;
  }
  .home:hover{color:var(--fg); border-color:var(--line-bright); background:var(--card)}

  /* ── 본문 ── */
  .wrap{max-width:920px; margin:0 auto; padding:30px 20px 64px}

  .head{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:26px}
  .head h1{
    margin:0; font-size:26px; font-weight:800; letter-spacing:-.03em;
    color:var(--fg-heading);
  }
  .head .sub{color:var(--muted); font-size:13.5px; margin-top:3px}
  .pill{
    margin-left:auto; display:inline-flex; align-items:center; gap:7px;
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700;
    border:1px solid var(--line); background:var(--card); backdrop-filter:blur(8px);
  }
  .pulse{width:8px; height:8px; border-radius:50%; background:var(--ok);
    box-shadow:0 0 0 0 rgba(34,197,94,.6); animation:pulse 2.2s infinite}
  .pulse.bad{background:var(--red); box-shadow:0 0 0 0 rgba(239,68,68,.6); animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}
    70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
  }

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:16px; margin-bottom:20px}
  .card{
    background:var(--card); backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:var(--radius-md);
    padding:18px; box-shadow:var(--shadow); transition:.2s;
  }
  .card:hover{border-color:var(--line-bright); background:var(--card-hover)}
  .k{color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
  .v{font-size:27px; font-weight:800; letter-spacing:-.035em; color:var(--fg-heading); margin-top:7px; line-height:1.15}
  .v small{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:0}
  .track{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:12px}
  .track>i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-light));
    transition:width .5s cubic-bezier(.4,0,.2,1)}
  .track>i.hot{background:linear-gradient(90deg,var(--amber),#fbbf24)}
  .track>i.crit{background:linear-gradient(90deg,var(--red),#f87171)}

  .panel{
    background:var(--card); backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:22px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .panel h2{
    margin:0 0 4px; font-size:16px; font-weight:800; letter-spacing:-.02em;
    color:var(--fg-heading);
  }
  .panel .desc{color:var(--muted); font-size:12.5px; margin-bottom:14px}

  .row{
    display:flex; align-items:center; gap:13px;
    padding:13px 14px; border-radius:var(--radius-sm);
    border:1px solid transparent; transition:.16s;
  }
  .row+.row{margin-top:5px}
  .row:hover{background:var(--card-hover); border-color:var(--line)}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .dot.on{background:var(--ok); box-shadow:0 0 11px rgba(34,197,94,.65)}
  .dot.off{background:var(--red); box-shadow:0 0 11px rgba(239,68,68,.65)}
  .row .nm{font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tag{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); white-space:nowrap;
  }
  .tag.ok{color:var(--ok); border-color:rgba(34,197,94,.3); background:rgba(34,197,94,.09)}
  .tag.bad{color:var(--red); border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.09)}

  .empty{color:var(--muted); font-size:13px; padding:18px 4px; text-align:center}
  .err{
    border:1px solid rgba(239,68,68,.35); background:rgba(239,68,68,.09);
    color:#fca5a5; border-radius:var(--radius-md); padding:15px 17px;
    font-size:13.5px; margin-bottom:18px; font-weight:600;
  }
  .foot{color:var(--muted); font-size:12px; text-align:center; margin-top:26px}
  .skel{
    background:linear-gradient(90deg,var(--line) 25%,var(--line-bright) 37%,var(--line) 63%);
    background-size:400% 100%; animation:sk 1.3s ease-in-out infinite;
    border-radius:6px; height:15px;
  }
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  @media (max-width:520px){
    .head h1{font-size:22px}
    .v{font-size:23px}
    .pill{margin-left:0}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="/"><span class="mark">🦷</span><b>파란이빨</b></a>
    <span class="nav-sp"></span>
    <a class="home" href="/">← 메인으로</a>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <div>
      <h1>서버 상태</h1>
      <div class="sub" id="sub">불러오는 중…</div>
    </div>
    <span class="pill"><span class="pulse" id="pulse"></span><span id="pillTx">연결 확인 중</span></span>
  </div>

  <div id="err"></div>

  <div class="grid" id="stats">
    <div class="card"><div class="k">메모리</div><div class="v"><span class="skel" style="display:block;width:70%"></span></div></div>
    <div class="card"><div class="k">디스크</div><div class="v"><span class="skel" style="display:block;width:70%"></span></div></div>
    <div class="card"><div class="k">가동 시간</div><div class="v"><span class="skel" style="display:block;width:55%"></span></div></div>
    <div class="card"><div class="k">부하</div><div class="v"><span class="skel" style="display:block;width:40%"></span></div></div>
  </div>

  <div class="panel">
    <h2>서비스</h2>
    <div class="desc">서울 VPS에서 상시 동작하는 구성요소</div>
    <div id="svc"><div class="empty">불러오는 중…</div></div>
  </div>

  <div class="panel">
    <h2>연결된 원격 노드</h2>
    <div class="desc">이 서버를 거쳐 들어와 있는 기기</div>
    <div id="tun"><div class="empty">불러오는 중…</div></div>
  </div>

  <div class="foot">10초마다 자동 갱신 · 읽기 전용 페이지</div>
</div>

<script>
const $ = id => document.getElementById(id);

// 서비스 이름 → 사람이 읽을 설명. 코드명만 보이면 뭐가 죽었는지 판단이 안 된다.
const LABEL = {
  'vibe-bridge': ['디스코드 브리지', '디스코드 ↔ Claude'],
  'hbbs':        ['RustDesk ID 서버', '원격제어 접속 중개'],
  'hbbr':        ['RustDesk 중계', '직결 실패 시 우회'],
  'nginx':       ['웹 서버', '이 페이지를 서빙'],
  'postgresql':  ['데이터베이스', 'PostgreSQL 18'],
  'vibe-status': ['상태 API', '이 페이지의 데이터원'],
};

function track(pct){
  const cls = pct >= 90 ? 'crit' : pct >= 75 ? 'hot' : '';
  return `<div class="track"><i class="${cls}" style="width:${Math.max(2,Math.min(100,pct))}%"></i></div>`;
}

function render(d){
  $('err').innerHTML = '';
  $('sub').textContent = `${d.node} · ${d.region} · 기준 ${d.checked_at}`;

  const svc = d.services || [];
  const down = svc.filter(s => !s.active);
  $('pulse').className = 'pulse' + (down.length ? ' bad' : '');
  $('pillTx').textContent = down.length ? `${down.length}개 중지됨` : '모두 정상';

  const m = d.resources?.mem || {}, k = d.resources?.disk || {};
  const memPct = m.total_mb ? Math.round(m.used_mb / m.total_mb * 100) : 0;
  $('stats').innerHTML = `
    <div class="card"><div class="k">메모리</div>
      <div class="v">${m.used_mb ?? '–'}<small> / ${m.total_mb ?? '–'} MB</small></div>
      ${track(memPct)}</div>
    <div class="card"><div class="k">디스크</div>
      <div class="v">${k.used_gb ?? '–'}<small> / ${k.total_gb ?? '–'} GB</small></div>
      ${track(k.pct ?? 0)}</div>
    <div class="card"><div class="k">가동 시간</div>
      <div class="v" style="font-size:20px">${d.resources?.uptime || '–'}</div></div>
    <div class="card"><div class="k">부하 (1분)</div>
      <div class="v">${d.resources?.load || '–'}</div></div>`;

  $('svc').innerHTML = svc.length ? svc.map(s => {
    const [nm, desc] = LABEL[s.name] || [s.name, ''];
    return `<div class="row">
      <span class="dot ${s.active ? 'on' : 'off'}"></span>
      <span class="nm">${nm}${desc ? ` <span style="font-weight:500;color:var(--muted);font-size:12.5px">· ${desc}</span>` : ''}</span>
      ${s.restarts ? `<span class="tag">재시작 ${s.restarts}</span>` : ''}
      <span class="tag ${s.active ? 'ok' : 'bad'}">${s.active ? '정상' : '중지'}</span>
    </div>`;
  }).join('') : '<div class="empty">정보 없음</div>';

  const t = d.tunnels || [];
  $('tun').innerHTML = t.length ? t.map(x => `
    <div class="row"><span class="dot on"></span>
      <span class="nm">터널 포트 ${x.tunnel_port}</span>
      <span class="tag ok">연결됨</span></div>`).join('')
    : '<div class="empty">아직 연결된 원격 노드가 없습니다.<br>크립토 PC·맥미니를 붙이면 여기에 표시됩니다.</div>';
}

async function tick(){
  try{
    const r = await fetch('/api/status', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  }catch(e){
    $('pulse').className = 'pulse bad';
    $('pillTx').textContent = '연결 실패';
    $('sub').textContent = '상태를 가져오지 못했습니다';
    $('err').innerHTML = `<div class="err">상태를 불러오지 못했습니다 — ${e.message}<br>
      서버 또는 상태 API가 내려갔을 수 있습니다.</div>`;
  }
}
tick();
setInterval(tick, 10000);
</script>
</body>
</html>
