<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="holoSpaceBg3" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="animHoloGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9">
        <animate attributeName="stop-color" values="#e879f9; #a855f7; #f43f5e; #e879f9" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #f43f5e; #e879f9; #a855f7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e; #e879f9; #818cf8; #f43f5e" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="liveHoloGlow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge><feMergeNode in="blur1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes holoScanRotate3 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes runeGlowPulse3 { 0%, 100% { filter: drop-shadow(0 0 6px #e879f9); } 50% { filter: drop-shadow(0 0 16px #f43f5e); } }
    @keyframes scanLineMove3 { 0% { transform: translateY(-30px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(30px); opacity: 0; } }
    .holo-ring-rotate3 { transform-origin: 60px 60px; animation: holoScanRotate3 12s linear indefinite; }
    .holo-ring-reverse3 { transform-origin: 60px 60px; animation: holoScanRotate3 8s linear indefinite reverse; }
    .rune-glow3 { animation: runeGlowPulse3 2.5s ease-in-out indefinite alternate; }
    .scan-line3 { animation: scanLineMove3 2.5s ease-in-out indefinite; }
  </style>
  <circle cx="60" cy="60" r="54" fill="url(#animHoloGradient3)" opacity="0.3" filter="url(#liveHoloGlow3)"/>
  <circle cx="60" cy="60" r="50" fill="url(#holoSpaceBg3)" stroke="url(#animHoloGradient3)" stroke-width="3"/>
  <g class="holo-ring-rotate3">
    <circle cx="60" cy="60" r="44" fill="none" stroke="url(#animHoloGradient3)" stroke-width="2" stroke-dasharray="18 10 35 15" opacity="0.9" filter="url(#liveHoloGlow3)"/>
    <circle cx="60" cy="16" r="3" fill="#e879f9" filter="url(#liveHoloGlow3)"/>
    <circle cx="60" cy="104" r="3" fill="#f43f5e" filter="url(#liveHoloGlow3)"/>
  </g>
  <g class="holo-ring-reverse3">
    <circle cx="60" cy="60" r="40" fill="none" stroke="#e879f9" stroke-width="1.2" stroke-dasharray="5 5 12 5" opacity="0.65"/>
  </g>
  <g class="scan-line3">
    <line x1="20" y1="60" x2="100" y2="60" stroke="#f43f5e" stroke-width="1.5" opacity="0.7" filter="url(#liveHoloGlow3)"/>
  </g>
  <circle cx="14" cy="60" r="2.5" fill="#f43f5e"/>
  <circle cx="106" cy="60" r="2.5" fill="#f43f5e"/>
  <g class="rune-glow3">
    <path d="M 60 26 L 60 94" stroke="url(#animHoloGradient3)" stroke-width="6.5" stroke-linecap="round" filter="url(#liveHoloGlow3)"/>
    <path d="M 60 26 L 77 43 L 60 60 L 77 77 L 60 94" stroke="url(#animHoloGradient3)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#liveHoloGlow3)"/>
    <path d="M 60 43 L 43 60 M 60 77 L 43 60" stroke="url(#animHoloGradient3)" stroke-width="6.5" stroke-linecap="round" filter="url(#liveHoloGlow3)"/>
  </g>
</svg>
