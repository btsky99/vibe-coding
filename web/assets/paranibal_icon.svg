<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 배경: 딥 바이킹 스페이스 스카이 -->
    <radialGradient id="vikingSpace" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- 24K 화려한 황금 그라데이션 -->
    <linearGradient id="goldRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffeb3"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- 일렉트릭 파란 네온 룬 그라데이션 -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- 강렬한 네온 광채 필터 -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 은은한 골드 후광 -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 방패 밖 후광 아우라 -->
  <circle cx="60" cy="60" r="54" fill="#0284c7" opacity="0.18" filter="url(#superGlow)"/>

  <!-- 바이킹 왕 방패 본체 -->
  <circle cx="60" cy="60" r="50" fill="url(#vikingSpace)" stroke="url(#goldRoyal)" stroke-width="3.5" filter="url(#goldGlow)"/>

  <!-- 방패 내부 황금 장식 링 & 음각 점 패턴 -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#electricBlue)" stroke-width="1.5" stroke-dasharray="6 3.5" opacity="0.8"/>
  <circle cx="60" cy="60" r="41" fill="none" stroke="url(#goldRoyal)" stroke-width="1" opacity="0.4"/>

  <!-- 방패 8방향 황금 스터드 (Nordic Gold Studs) -->
  <circle cx="60" cy="14" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="60" cy="106" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="14" cy="60" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="106" cy="60" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="27" cy="27" r="2" fill="url(#goldRoyal)"/>
  <circle cx="93" cy="27" r="2" fill="url(#goldRoyal)"/>
  <circle cx="27" cy="93" r="2" fill="url(#goldRoyal)"/>
  <circle cx="93" cy="93" r="2" fill="url(#goldRoyal)"/>

  <!-- 화려한 하랄드 바이킹 킹 왕관 (Harald Royal Crown) -->
  <!-- M 40 33 L 45 22 L 53 28 L 60 18 L 67 28 L 75 22 L 80 33 Z -->
  <path d="M 40 33 L 45 21 L 53 27 L 60 17 L 67 27 L 75 21 L 80 33 Z" fill="url(#goldRoyal)" stroke="#fffeb3" stroke-width="0.8" filter="url(#goldGlow)"/>
  <!-- 왕관 보석 포인트 (루비 & 사파이어) -->
  <circle cx="60" cy="17" r="2.5" fill="#f43f5e"/>
  <circle cx="45" cy="21" r="1.8" fill="#38bdf8"/>
  <circle cx="75" cy="21" r="1.8" fill="#38bdf8"/>
  <rect x="42" y="30" width="36" height="3" rx="1.5" fill="#fef08a" opacity="0.9"/>

  <!-- 메인 하랄드 블루투스 룬 (ᚼ + ᛒ Bindrune) - 강렬한 일렉트릭 네온 -->
  <!-- 중앙 기둥 -->
  <path d="M 60 36 L 60 88" stroke="url(#electricBlue)" stroke-width="6" stroke-linecap="round" filter="url(#superGlow)"/>
  <!-- B 룬 (Bjarkan) 가지 -->
  <path d="M 60 36 L 75 49 L 60 62 L 75 75 L 60 88" stroke="url(#electricBlue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#superGlow)"/>
  <!-- H 룬 (Hagall) 대각선 -->
  <path d="M 60 49 L 45 62 M 60 75 L 45 62" stroke="url(#electricBlue)" stroke-width="6" stroke-linecap="round" filter="url(#superGlow)"/>

  <!-- 반짝이는 황금 광채 입자 (Royal Sparkles) -->
  <path d="M 98 22 L 100 27 L 105 29 L 100 31 L 98 36 L 96 31 L 91 29 L 96 27 Z" fill="#fef08a" filter="url(#goldGlow)"/>
  <path d="M 20 86 L 21.5 90 L 25.5 91.5 L 21.5 93 L 20 97 L 18.5 93 L 14.5 91.5 L 18.5 90 Z" fill="#7dd3fc" filter="url(#superGlow)"/>
  <circle cx="28" cy="38" r="1.5" fill="#fef08a"/>
  <circle cx="94" cy="78" r="2" fill="#38bdf8"/>
</svg>
