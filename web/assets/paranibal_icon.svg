<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 홀로그램 스페이스 딥 나이트 -->
    <radialGradient id="holoSpaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- 동적 변색 홀로그램 프리즘 그라데이션 -->
    <linearGradient id="animHoloGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee; #38bdf8; #f472b6; #22d3ee" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 강렬한 살아있는 네온 글로우 필터 -->
    <filter id="liveHoloGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* SVG 내장 홀로그램 애니메이션 */
    @keyframes holoScanRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes holoPulseAura {
      0%, 100% { opacity: 0.25; transform: scale(0.96); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes runeGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 6px #38bdf8); }
      50% { filter: drop-shadow(0 0 16px #c084fc); }
    }
    @keyframes scanLineMove {
      0% { transform: translateY(-30px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(30px); opacity: 0; }
    }

    .holo-aura {
      transform-origin: 60px 60px;
      animation: holoPulseAura 3s ease-in-out indefinite alternate;
    }
    .holo-ring-rotate {
      transform-origin: 60px 60px;
      animation: holoScanRotate 12s linear indefinite;
    }
    .holo-ring-reverse {
      transform-origin: 60px 60px;
      animation: holoScanRotate 8s linear indefinite reverse;
    }
    .rune-glow {
      animation: runeGlowPulse 2.5s ease-in-out indefinite alternate;
    }
    .scan-line {
      animation: scanLineMove 2.5s ease-in-out indefinite;
    }
  </style>

  <!-- 애니메이션 1: 배경 외곽 펄스 홀로그램 아우라 -->
  <circle cx="60" cy="60" r="54" fill="url(#animHoloGradient)" opacity="0.3" class="holo-aura" filter="url(#liveHoloGlow)"/>

  <!-- 방패 본체 배경 -->
  <circle cx="60" cy="60" r="50" fill="url(#holoSpaceBg)" stroke="url(#animHoloGradient)" stroke-width="3"/>

  <!-- 애니메이션 2: 시계 방향 회전하는 룬 방패 링 -->
  <g class="holo-ring-rotate">
    <circle cx="60" cy="60" r="44" fill="none" stroke="url(#animHoloGradient)" stroke-width="2" stroke-dasharray="18 10 35 15" opacity="0.9" filter="url(#liveHoloGlow)"/>
    <circle cx="60" cy="16" r="3" fill="#38bdf8" filter="url(#liveHoloGlow)"/>
    <circle cx="60" cy="104" r="3" fill="#c084fc" filter="url(#liveHoloGlow)"/>
  </g>

  <!-- 애니메이션 3: 반시계 방향 회전하는 점선 링 -->
  <g class="holo-ring-reverse">
    <circle cx="60" cy="60" r="40" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5 5 12 5" opacity="0.65"/>
  </g>

  <!-- 애니메이션 4: 레이저 홀로그램 스캔 빔 (위아래로 움직임) -->
  <g class="scan-line">
    <line x1="20" y1="60" x2="100" y2="60" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" filter="url(#liveHoloGlow)"/>
  </g>

  <!-- 방패 4방향 고정 스터드 -->
  <circle cx="14" cy="60" r="2.5" fill="#38bdf8"/>
  <circle cx="106" cy="60" r="2.5" fill="#38bdf8"/>

  <!-- 애니메이션 5: 살아 움직이는 파란이빨 하랄드 룬 심볼 (ᚼ + ᛒ) -->
  <g class="rune-glow">
    <!-- 중앙 기둥 -->
    <path d="M 60 26 L 60 94" stroke="url(#animHoloGradient)" stroke-width="6.5" stroke-linecap="round" filter="url(#liveHoloGlow)"/>
    <!-- B 룬 (Bjarkan) -->
    <path d="M 60 26 L 77 43 L 60 60 L 77 77 L 60 94" stroke="url(#animHoloGradient)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#liveHoloGlow)"/>
    <!-- H 룬 (Hagall) -->
    <path d="M 60 43 L 43 60 M 60 77 L 43 60" stroke="url(#animHoloGradient)" stroke-width="6.5" stroke-linecap="round" filter="url(#liveHoloGlow)"/>
  </g>
</svg>
