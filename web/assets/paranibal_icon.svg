<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 바이킹 딥 블루 그래디언트 -->
    <linearGradient id="vikingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 노르딕 네온 파란 빛 -->
    <linearGradient id="runeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- 금빛 왕관 하이라이트 -->
    <linearGradient id="vikingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="vikingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 원형 바이킹 룬 방패 배경 -->
  <circle cx="60" cy="60" r="50" fill="url(#vikingBg)" stroke="url(#runeBlue)" stroke-width="3"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- 상단 바이킹 왕관 (Harald Bluetooth Crown) -->
  <path d="M 44 32 L 48 24 L 60 30 L 72 24 L 76 32 Z" fill="url(#vikingGold)"/>
  <circle cx="60" cy="22" r="2.5" fill="#fbbf24"/>

  <!-- 정통 하랄드 블루투스 룬 문자 (ᚼ + ᛒ Bindrune) -->
  <!-- 중앙 기둥 및 룬 줄기 -->
  <path d="M 60 34 L 60 86" stroke="url(#runeBlue)" stroke-width="5" stroke-linecap="round" filter="url(#vikingGlow)"/>
  <!-- 오른쪽 B 룬 가지 (Bjarkan) -->
  <path d="M 60 34 L 74 47 L 60 60 L 74 73 L 60 86" stroke="url(#runeBlue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#vikingGlow)"/>
  <!-- 왼쪽 H 룬 대각선 (Hagall) -->
  <path d="M 60 47 L 46 60 M 60 73 L 46 60" stroke="url(#runeBlue)" stroke-width="5" stroke-linecap="round" filter="url(#vikingGlow)"/>

  <!-- 바이킹 방패 리벳 (Nordic Shield Studs) -->
  <circle cx="60" cy="14" r="2" fill="#38bdf8"/>
  <circle cx="60" cy="106" r="2" fill="#38bdf8"/>
  <circle cx="14" cy="60" r="2" fill="#38bdf8"/>
  <circle cx="106" cy="60" r="2" fill="#38bdf8"/>
</svg>
