<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 딥 몽환 사이버 바이킹 스페이스 -->
    <radialGradient id="holoSpace" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- 홀로그램 프리즘 입체 그래디언트 (시안-핑크-퍼플-블루) -->
    <linearGradient id="holoPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- 24K 럭셔리 황금 그라데이션 -->
    <linearGradient id="goldRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffeb3"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- 강렬한 홀로그램 글로우 -->
    <filter id="holoGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 홀로그램 멀티 아우라 빛 반사 -->
  <circle cx="60" cy="60" r="55" fill="url(#holoPrism)" opacity="0.22" filter="url(#holoGlow)"/>

  <!-- 메인 방패 배경 -->
  <circle cx="60" cy="60" r="50" fill="url(#holoSpace)" stroke="url(#goldRoyal)" stroke-width="3.5" filter="url(#goldGlow)"/>

  <!-- 홀로그램 무지개 링 & 스캔 라인 이펙트 -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#holoPrism)" stroke-width="2" opacity="0.85" filter="url(#holoGlow)"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5 3 2 3" opacity="0.7"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#holoPrism)" stroke-width="0.8" stroke-dasharray="20 10" opacity="0.5"/>

  <!-- 홀로그램 스캔빔 수평 라인들 (Cyber Holographic Scanning Rays) -->
  <line x1="20" y1="42" x2="100" y2="42" stroke="url(#holoPrism)" stroke-width="0.6" opacity="0.4"/>
  <line x1="16" y1="54" x2="104" y2="54" stroke="url(#holoPrism)" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="66" x2="104" y2="66" stroke="url(#holoPrism)" stroke-width="0.8" opacity="0.5"/>
  <line x1="20" y1="78" x2="100" y2="78" stroke="url(#holoPrism)" stroke-width="0.6" opacity="0.4"/>

  <!-- 방패 8방향 스터드 -->
  <circle cx="60" cy="14" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="60" cy="106" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="14" cy="60" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="106" cy="60" r="2.5" fill="url(#goldRoyal)"/>
  <circle cx="27" cy="27" r="2" fill="url(#goldRoyal)"/>
  <circle cx="93" cy="27" r="2" fill="url(#goldRoyal)"/>
  <circle cx="27" cy="93" r="2" fill="url(#goldRoyal)"/>
  <circle cx="93" cy="93" r="2" fill="url(#goldRoyal)"/>

  <!-- 화려한 하랄드 바이킹 왕관 (황금 + 홀로그램 주얼) -->
  <path d="M 40 33 L 45 21 L 53 27 L 60 17 L 67 27 L 75 21 L 80 33 Z" fill="url(#goldRoyal)" stroke="#fffeb3" stroke-width="0.8" filter="url(#goldGlow)"/>
  <circle cx="60" cy="17" r="2.8" fill="#f43f5e" filter="url(#goldGlow)"/>
  <circle cx="45" cy="21" r="2" fill="#22d3ee" filter="url(#holoGlow)"/>
  <circle cx="75" cy="21" r="2" fill="#f472b6" filter="url(#holoGlow)"/>
  <rect x="42" y="30" width="36" height="3" rx="1.5" fill="url(#holoPrism)" opacity="0.9"/>

  <!-- 메인 하랄드 블루투스 홀로그램 룬 (ᚼ + ᛒ Bindrune) -->
  <path d="M 60 36 L 60 88" stroke="url(#holoPrism)" stroke-width="6.5" stroke-linecap="round" filter="url(#holoGlow)"/>
  <path d="M 60 36 L 75 49 L 60 62 L 75 75 L 60 88" stroke="url(#holoPrism)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#holoGlow)"/>
  <path d="M 60 49 L 45 62 M 60 75 L 45 62" stroke="url(#holoPrism)" stroke-width="6.5" stroke-linecap="round" filter="url(#holoGlow)"/>

  <!-- 홀로그램 다이아몬드 별빛 & 프리즘 굴절 큐브 -->
  <path d="M 98 22 L 101 28 L 107 30 L 101 32 L 98 38 L 95 32 L 89 30 L 95 28 Z" fill="#f472b6" filter="url(#holoGlow)"/>
  <path d="M 22 84 L 24 L 29 90 L 24 L 22 96 L 20 L 15 90 L 20 Z" fill="#22d3ee" filter="url(#holoGlow)"/>
  <path d="M 92 84 L 94 L 97 87 L 94 L 92 90 L 90 L 87 87 L 90 Z" fill="#fef08a"/>
</svg>
