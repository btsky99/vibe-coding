<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파란이빨 — 사이버 홀로그램 하랄드 바이킹 킹 로고</title>
<style>
  body {
    background: #030712;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 1.9rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
  .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 24px; text-align: center; }
  .hero-card {
    background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
    border: 2px solid #38bdf8;
    box-shadow: 0 0 50px rgba(244, 114, 182, 0.3), 0 0 25px rgba(56, 189, 248, 0.4);
    border-radius: 24px;
    padding: 38px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 480px;
    width: 100%;
    margin-bottom: 30px;
  }
  .hero-card img {
    width: 144px;
    height: 144px;
    margin-bottom: 20px;
    filter: drop-shadow(0 12px 28px rgba(56, 189, 248, 0.4));
  }
  .hero-card h2 {
    background: linear-gradient(135deg, #38bdf8, #f472b6, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 1.5rem;
    margin: 0 0 10px 0;
    font-weight: 800;
  }
  .hero-card p {
    color: #cbd5e1;
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0;
  }
  .badge-holo {
    background: linear-gradient(135deg, #38bdf8, #f472b6, #a855f7);
    color: #ffffff;
    font-size: 0.8rem;
    padding: 4px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <h1>🌈 파란이빨 (Harald Bluetooth) 사이버 홀로그램 로고</h1>
  <p class="subtitle">미래지향적 프리즘 홀로그램 광채 & 덴마크 바이킹 킹 엠블럼</p>

  <div class="hero-card">
    <span class="badge-holo">사이버 홀로그램 A안 (적용 완료 💎)</span>
    <img src="./paranibal_icon.svg" alt="사이버 홀로그램 A안">
    <h2>하랄드 사이버 홀로그램 엠블럼</h2>
    <p>
      핑크-시안-퍼플-블루 3D 프리즘 홀로그램 광채와 스캔라인, 24K 바이킹 황금 왕관 및 루비 보석이 유기적으로 조합된 영롱한 미래형 로고입니다.
    </p>
  </div>

</body>
</html>
