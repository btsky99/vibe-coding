<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파란이빨 — 실시간 홀로그램 애니메이션 바이킹 룬 로고</title>
<style>
  body {
    background: #020408;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 1.9rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
  .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 28px; text-align: center; }
  .hero-card {
    background: radial-gradient(circle at center, #1e1b4b 0%, #020408 100%);
    border: 1.5px solid #38bdf8;
    box-shadow: 0 0 60px rgba(56, 189, 248, 0.35), 0 0 30px rgba(192, 132, 252, 0.25);
    border-radius: 24px;
    padding: 42px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 480px;
    width: 100%;
    margin-bottom: 30px;
  }
  .hero-card img {
    width: 150px;
    height: 150px;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.6));
  }
  .hero-card h2 {
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 1.55rem;
    margin: 0 0 10px 0;
    font-weight: 800;
  }
  .hero-card p {
    color: #cbd5e1;
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0;
  }
  .badge-live {
    background: linear-gradient(135deg, #38bdf8, #a855f7);
    color: #ffffff;
    font-size: 0.8rem;
    padding: 5px 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
  }
</style>
</head>
<body>

  <h1>✨ 파란이빨 (Harald Bluetooth) 라이브 홀로그램 로고</h1>
  <p class="subtitle">실제로 끊임없이 움직이고 빛나는 SF 홀로그램 애니메이션 이펙트</p>

  <div class="hero-card">
    <span class="badge-live">LIVE 홀로그램 애니메이션 (적용 완료 🔮)</span>
    <img src="./paranibal_icon.svg" alt="LIVE 홀로그램 애니메이션">
    <h2>하랄드 모션 홀로그램 룬</h2>
    <p>
      회전하는 홀로그램 스캔 링, 위아래로 움직이는 레이저 스캔 빔, 은은하게 숨쉬는 룬 문자(ᚼ+ᛒ) 네온 펄스 광채가 실제로 살아 움직입니다!
    </p>
  </div>

</body>
</html>
