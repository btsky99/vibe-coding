<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파란이빨 — A안 왕관 제거 깔끔한 바이킹 방패 룬 로고</title>
<style>
  body {
    background: #030712;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 1.9rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
  .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 24px; text-align: center; }
  .hero-card {
    background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
    border: 1px solid #38bdf8;
    box-shadow: 0 0 45px rgba(56, 189, 248, 0.3);
    border-radius: 24px;
    padding: 38px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 480px;
    width: 100%;
    margin-bottom: 30px;
  }
  .hero-card img {
    width: 144px;
    height: 144px;
    margin-bottom: 20px;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.6));
  }
  .hero-card h2 {
    color: #38bdf8;
    font-size: 1.45rem;
    margin: 0 0 10px 0;
    font-weight: 800;
  }
  .hero-card p {
    color: #cbd5e1;
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0;
  }
  .badge-clean {
    background: rgba(56, 189, 248, 0.2);
    color: #38bdf8;
    border: 1px solid #38bdf8;
    font-size: 0.8rem;
    padding: 4px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-weight: 800;
  }
</style>
</head>
<body>

  <h1>🛡️ 파란이빨 (Harald Bluetooth) 세련된 A안 로고</h1>
  <p class="subtitle">노란 왕관을 깔끔하게 제거하고 A안의 세련된 바이킹 방패+룬 문자 조합에 집중한 로고</p>

  <div class="hero-card">
    <span class="badge-clean">A안 왕관 제거 버전 (적용 완료 💙)</span>
    <img src="./paranibal_icon.svg" alt="A안 왕관 제거 버전">
    <h2>하랄드 세련된 룬 방패 엠블럼</h2>
    <p>
      촌스러웠던 상단 노란 왕관과 금색 부속을 완전히 제거하고, A안의 정통 바이킹 룬 방패와 파란 네온 룬 문자(ᚼ+ᛒ)의 비율과 중심을 정교하게 다듬었습니다.
    </p>
  </div>

</body>
</html>
