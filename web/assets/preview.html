<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파란이빨 — 퓨어 사이버 홀로그램 룬 로고</title>
<style>
  body {
    background: #020408;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 1.9rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
  .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 28px; text-align: center; }
  .hero-card {
    background: radial-gradient(circle at center, #0f172a 0%, #020408 100%);
    border: 1px solid #38bdf8;
    box-shadow: 0 0 50px rgba(56, 189, 248, 0.25), 0 0 20px rgba(192, 132, 252, 0.2);
    border-radius: 24px;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 460px;
    width: 100%;
    margin-bottom: 30px;
  }
  .hero-card img {
    width: 140px;
    height: 140px;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
  }
  .hero-card h2 {
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 1.5rem;
    margin: 0 0 10px 0;
    font-weight: 800;
  }
  .hero-card p {
    color: #94a3b8;
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0;
  }
  .badge-pure {
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    border: 1px solid #38bdf8;
    font-size: 0.8rem;
    padding: 4px 14px;
    border-radius: 12px;
    margin-bottom: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <h1>✨ 파란이빨 (Harald Bluetooth) 퓨어 홀로그램 로고</h1>
  <p class="subtitle">왕관 없이 극도로 심플하고 세련된 SF 사이버 홀로그램 룬 엠블럼</p>

  <div class="hero-card">
    <span class="badge-pure">퓨어 사이버 홀로그램 💎</span>
    <img src="./paranibal_icon.svg" alt="퓨어 사이버 홀로그램">
    <h2>하랄드 퓨어 홀로그램 룬</h2>
    <p>
      왕관과 과한 장식을 완전히 배제하고, 공중에 투영된 SF 인터페이스 감성의 투명 홀로그램 블루투스 룬(ᚼ+ᛒ) 엠블럼입니다.
    </p>
  </div>

</body>
</html>
