<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파란이빨 — 덴마크 바이킹 왕 하랄드 블루투스 화려한 A안 로고</title>
<style>
  body {
    background: #030712;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 1.9rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
  .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 24px; text-align: center; }
  .hero-card {
    background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
    border: 2px solid #f59e0b;
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.25), 0 0 20px rgba(245, 158, 11, 0.3);
    border-radius: 24px;
    padding: 36px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 480px;
    width: 100%;
    margin-bottom: 30px;
  }
  .hero-card img {
    width: 140px;
    height: 140px;
    margin-bottom: 20px;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.6));
  }
  .hero-card h2 {
    color: #fef08a;
    font-size: 1.4rem;
    margin: 0 0 10px 0;
  }
  .hero-card p {
    color: #cbd5e1;
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0;
  }
  .badge-royal {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000;
    font-size: 0.8rem;
    padding: 4px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <h1>👑 파란이빨 (Harald Bluetooth) 화려한 로고 완성</h1>
  <p class="subtitle">10세기 덴마크 바이킹 왕 하랄드 블루투스의 유래를 담은 화려한 A안 엠블럼</p>

  <div class="hero-card">
    <span class="badge-royal">화려한 A안 (적용 완료 ✨)</span>
    <img src="./paranibal_icon.svg" alt="화려한 A안">
    <h2>하랄드 24K 룬 왕관 엠블럼</h2>
    <p>
      보석이 박힌 황금 바이킹 왕관과 일렉트릭 파란 네온 룬 문자(ᚼ+ᛒ), 8방향 황금 방패 스터드 및 별빛 광채 아우라가 가미된 최고급 로고입니다.
    </p>
  </div>

</body>
</html>
