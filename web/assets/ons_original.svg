<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라디언트 정의 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    
    <!-- 그림자 필터 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- O -->
  <g transform="translate(10, 15)">
    <path d="M 25 0 
             C 38.807 0 50 11.193 50 25
             C 50 38.807 38.807 50 25 50
             C 11.193 50 0 38.807 0 25
             C 0 11.193 11.193 0 25 0
             Z
             M 25 12
             C 31.075 12 36 16.925 36 23
             C 36 29.075 31.075 34 25 34
             C 18.925 34 14 29.075 14 23
             C 14 16.925 18.925 12 25 12
             Z"
          fill="url(#gradient1)" 
          filter="url(#shadow)"
          opacity="0.95"/>
  </g>
  
  <!-- n -->
  <g transform="translate(65, 25)">
    <path d="M 0 0
             L 0 30
             L 8 30
             L 8 12
             C 8 8 10 6 14 6
             C 18 6 20 8 20 12
             L 20 30
             L 28 30
             L 28 10
             C 28 4 24 0 18 0
             C 14 0 11 1 8 3
             L 8 0
             Z"
          fill="url(#gradient2)" 
          filter="url(#shadow)"
          opacity="0.95"/>
  </g>
  
  <!-- S -->
  <g transform="translate(135, 15)">
    <path d="M 30 10
             C 30 4 25 0 18 0
             L 12 0
             C 5 0 0 4 0 10
             C 0 14 2 17 6 19
             L 15 23
             C 17 24 18 25 18 27
             C 18 29 16 30 13 30
             L 10 30
             C 7 30 5 29 5 27
             L 0 27
             C 0 33 5 38 12 38
             L 18 38
             C 25 38 30 34 30 28
             C 30 24 28 21 24 19
             L 15 15
             C 13 14 12 13 12 11
             C 12 9 14 8 17 8
             L 20 8
             C 23 8 25 9 25 11
             L 30 10
             Z"
          fill="url(#gradient3)" 
          filter="url(#shadow)"
          opacity="0.95"/>
  </g>
  
  <!-- 3D 효과를 위한 추가 레이어 -->
  <g transform="translate(10, 15)" opacity="0.3">
    <path d="M 25 2 
             C 37.703 2 48 12.297 48 25
             C 48 37.703 37.703 48 25 48"
          fill="none" 
          stroke="url(#gradient1)" 
          stroke-width="1"/>
  </g>
  
  <g transform="translate(65, 25)" opacity="0.3">
    <path d="M 2 2
             L 2 28
             L 6 28"
          fill="none" 
          stroke="url(#gradient2)" 
          stroke-width="1"/>
  </g>
  
  <g transform="translate(135, 15)" opacity="0.3">
    <path d="M 28 10
             C 28 5 24 2 18 2"
          fill="none" 
          stroke="url(#gradient3)" 
          stroke-width="1"/>
  </g>
</svg>