<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="holoSpaceBg2" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="animHoloGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981; #06b6d4; #34d399; #10b981" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #34d399; #10b981; #06b6d4" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399; #10b981; #38bdf8; #34d399" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="liveHoloGlow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge><feMergeNode in="blur1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes holoScanRotate2 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes runeGlowPulse2 { 0%, 100% { filter: drop-shadow(0 0 6px #10b981); } 50% { filter: drop-shadow(0 0 16px #06b6d4); } }
    @keyframes scanLineMove2 { 0% { transform: translateY(-30px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(30px); opacity: 0; } }
    .holo-ring-rotate2 { transform-origin: 60px 60px; animation: holoScanRotate2 12s linear indefinite; }
    .holo-ring-reverse2 { transform-origin: 60px 60px; animation: holoScanRotate2 8s linear indefinite reverse; }
    .rune-glow2 { animation: runeGlowPulse2 2.5s ease-in-out indefinite alternate; }
    .scan-line2 { animation: scanLineMove2 2.5s ease-in-out indefinite; }
  </style>
  <circle cx="60" cy="60" r="54" fill="url(#animHoloGradient2)" opacity="0.3" filter="url(#liveHoloGlow2)"/>
  <circle cx="60" cy="60" r="50" fill="url(#holoSpaceBg2)" stroke="url(#animHoloGradient2)" stroke-width="3"/>
  <g class="holo-ring-rotate2">
    <circle cx="60" cy="60" r="44" fill="none" stroke="url(#animHoloGradient2)" stroke-width="2" stroke-dasharray="18 10 35 15" opacity="0.9" filter="url(#liveHoloGlow2)"/>
    <circle cx="60" cy="16" r="3" fill="#10b981" filter="url(#liveHoloGlow2)"/>
    <circle cx="60" cy="104" r="3" fill="#06b6d4" filter="url(#liveHoloGlow2)"/>
  </g>
  <g class="holo-ring-reverse2">
    <circle cx="60" cy="60" r="40" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5 5 12 5" opacity="0.65"/>
  </g>
  <g class="scan-line2">
    <line x1="20" y1="60" x2="100" y2="60" stroke="#34d399" stroke-width="1.5" opacity="0.7" filter="url(#liveHoloGlow2)"/>
  </g>
  <circle cx="14" cy="60" r="2.5" fill="#34d399"/>
  <circle cx="106" cy="60" r="2.5" fill="#34d399"/>
  <g class="rune-glow2">
    <path d="M 60 26 L 60 94" stroke="url(#animHoloGradient2)" stroke-width="6.5" stroke-linecap="round" filter="url(#liveHoloGlow2)"/>
    <path d="M 60 26 L 77 43 L 60 60 L 77 77 L 60 94" stroke="url(#animHoloGradient2)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#liveHoloGlow2)"/>
    <path d="M 60 43 L 43 60 M 60 77 L 43 60" stroke="url(#animHoloGradient2)" stroke-width="6.5" stroke-linecap="round" filter="url(#liveHoloGlow2)"/>
  </g>
</svg>
