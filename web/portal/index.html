<!DOCTYPE html>
<!--
  FILE: web/portal/index.html
  DESCRIPTION: 파란이발(btsky) 포털 — 계정 관리 및 프로젝트별 접근 권한 제어판.
    btsky99 계정 및 관리자 로그인 시 '👑 파란이발 관리자' 회원 승인 대기열 및 5대 프로젝트별 접근 허용 체크박스 제어판 활성화.
    maptory3 및 승인된 계정 대시보드 강제 통과.
  REVISION HISTORY:
    - 2026-07-22 Claude: 사용자 관리 전용 구축.
    - 2026-07-26 Gemini: maptory3 계정 무조건 승인 통과 및 대시보드 강제 진입 보장.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파란이발 포털 — 계정 & 프로젝트 권한 관리</title>
<link rel="icon" href="../assets/paranibal_icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
<script src="../auth.js?v=20260726_v10"></script>
<style>
  .proto-banner {
    background: linear-gradient(90deg, rgba(37, 99, 235, 0.2), rgba(6, 182, 212, 0.2));
    border-bottom: 1px solid rgba(37, 99, 235, 0.35);
    color: var(--accent-light); text-align: center; font-size: 13.5px; font-weight: 600; padding: 9px 16px;
  }
  .center-layout {
    min-height: calc(100vh - 40px); display: flex; align-items: center; justify-content: center; padding: 32px 20px;
  }
  .portal-card {
    background: var(--card); border: 1px solid var(--line-bright); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 44px 38px; max-width: 440px; width: 100%; text-align: center;
    backdrop-filter: blur(16px); animation: fadeIn 0.4s ease-out;
  }
  .portal-card h1 { font-size: 24px; font-weight: 800; color: var(--fg-heading); margin-bottom: 8px; }
  .pend-ic { font-size: 56px; margin-bottom: 12px; display: inline-block; animation: floatSlow 4s infinite ease-in-out; }
  .pend-who { font-size: 16px; font-weight: 700; color: var(--accent-light); margin-bottom: 6px; }
  .pend-msg { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 12px 0 26px; }
  .btn-full { width: 100%; margin-top: 10px; }

  #app { display: none; }
  .top-header {
    display: flex; align-items: center; justify-content: space-between; padding: 16px 6vw;
    border-bottom: 1px solid var(--line); background: var(--nav); backdrop-filter: blur(16px);
    position: sticky; top: 0; z-index: 50;
  }
  .top-header .brand { font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 10px; }
  .role-badge { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; letter-spacing: 0.02em; }
  .role-badge.admin { background: rgba(37, 99, 235, 0.2); color: var(--accent-light); border: 1px solid rgba(37, 99, 235, 0.4); }
  .role-badge.user { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
  
  .top-right { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; vertical-align: middle; border: 1px solid var(--line-bright); }
  
  .wrap-container { max-width: 920px; margin: 0 auto; padding: 36px 6vw; }
  .greet-title { font-size: 25px; font-weight: 800; color: var(--fg-heading); margin-bottom: 6px; }
  .greet-sub { color: var(--muted); margin-bottom: 30px; font-size: 15px; }
  
  .panel-box {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 28px; backdrop-filter: blur(16px); box-shadow: var(--shadow);
  }
  .panel-box.admin { border-color: rgba(37, 99, 235, 0.35); }
  .panel-box h3 { font-size: 18px; font-weight: 800; color: var(--fg-heading); margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; }
  .panel-box h3 .cnt { font-weight: 700; font-size: 12px; color: var(--accent-light); background: rgba(37, 99, 235, 0.15); padding: 2px 10px; border-radius: 999px; }
  
  .user-card-box {
    background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 16px; transition: border-color 0.2s;
  }
  .user-card-box:hover { border-color: rgba(37, 99, 235, 0.4); }
  .user-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  
  .uava {
    width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.05);
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
    border: 1px solid var(--line); color: var(--fg-heading); overflow: hidden;
  }
  .uava img { width: 100%; height: 100%; object-fit: cover; }
  .utag { font-size: 12px; padding: 3px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.04); color: var(--muted); border: 1px solid var(--line); }
  
  .perm-checks {
    display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 16px; padding: 12px 14px;
    background: rgba(0, 0, 0, 0.2); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .perm-label {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
    color: var(--fg-heading); cursor: pointer; padding: 4px 10px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); transition: all 0.15s;
  }
  .perm-label:hover { border-color: var(--accent); background: rgba(37, 99, 235, 0.1); }
  .perm-label input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  .btn-approve {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none;
    padding: 8px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px var(--accent-glow); transition: transform 0.15s;
  }
  .btn-approve:hover { transform: translateY(-1px); }
  
  .btn-revoke {
    background: none; color: var(--muted); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .btn-revoke:hover { color: var(--red); border-color: var(--red); background: rgba(239, 68, 68, 0.08); }
  
  .sub-h { font-size: 13px; color: var(--accent-light); font-weight: 800; margin: 26px 0 12px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
  .sub-h:first-child { margin-top: 0; }
  .none-msg { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; background: rgba(255,255,255,0.01); border-radius: 10px; border: 1px dashed var(--line); }
  
  .welcome-box {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 48px; text-align: center; backdrop-filter: blur(16px);
  }
  .welcome-box .ic { font-size: 52px; margin-bottom: 12px; }
  .welcome-box h3 { font-size: 22px; font-weight: 800; color: var(--fg-heading); }
  .welcome-box p { color: var(--muted); margin-top: 10px; font-size: 15px; }

  .my-perms {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;
  }
  .my-perm-chip {
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    background: rgba(37, 99, 235, 0.15); color: var(--accent-light); border: 1px solid rgba(37, 99, 235, 0.3);
  }
</style>
</head>
<body>
  <div class="proto-banner">
    💈 파란이발 계정 & 프로젝트 권한 제어판 — 회원별 5대 프로젝트 허용 권한을 선택 지정하세요.
  </div>

  <!-- 승인 대기 화면 -->
  <div id="pending" class="center-layout" style="display:none">
    <div class="portal-card">
      <div class="pend-ic">⏳</div>
      <h1>가입 승인 대기 중</h1>
      <div class="pend-who" id="pendWho"></div>
      <p class="pend-msg">가입 및 프로젝트 이용 권한 신청이 전달되었습니다.<br>파란이발 관리자(btsky99)가 승인하면 허용된 프로젝트 이용 권한이 개방됩니다.</p>
      <button class="btn line btn-full" onclick="refreshPending()">🔄 승인 상태 새로고침</button>
      <button class="btn dl btn-full" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <!-- 메인 포털 대시보드 -->
  <div id="app">
    <div class="top-header">
      <div class="brand">
        <span class="brand-icon">💈</span> 파란이발 제어판
        <span class="role-badge" id="roleBadge"></span>
      </div>
      <div class="top-right">
        <span id="whoami"></span>
        <a class="nlink" href="../">← 파란이발 허브</a>
        <button class="nlink solid" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="wrap-container">
      <div class="greet-title" id="greet"></div>
      <div class="greet-sub" id="greetSub"></div>
      <div id="content"></div>
    </div>
  </div>

<script>
const A = window.App;

function hideAll(){ document.getElementById('pending').style.display='none'; document.getElementById('app').style.display='none'; }

function enter(sess){
  hideAll();
  const idStr = String(sess.id || sess.email || '').toLowerCase();
  const isAdmin = sess.role==='admin' || idStr.includes('btsky99') || idStr.includes('paranibal');
  
  // maptory3 계정이거나 isApproved 통과 시 무조건 대시보드로 진입!
  if (isAdmin || idStr.includes('maptory3') || A.isApproved(sess.id) || A.isApproved(sess.email)) {
    renderApp(sess);
  } else {
    A.addPending(sess);
    showPending(sess);
  }
}

function showPending(sess){
  document.getElementById('pending').style.display='flex';
  document.getElementById('pendWho').textContent = sess.name + (sess.email?` (${sess.email})`:'');
}

function refreshPending(){ const s=A.AUTH.current(); if(s) enter(s); else location.href='../'; }
function logout(){ A.AUTH.logout(); location.href='../'; }

function renderApp(sess){
  hideAll(); document.getElementById('app').style.display='block';
  const idStr = String(sess.id || sess.email || '').toLowerCase();
  const isAdmin = sess.role==='admin' || idStr.includes('btsky99') || idStr.includes('paranibal');
  const rb=document.getElementById('roleBadge');
  rb.textContent = isAdmin ? '👑 파란이발 관리자' : '✅ 승인된 회원';
  rb.className = 'role-badge ' + (isAdmin ? 'admin' : 'user');
  
  const av = sess.picture?`<img class="avatar" src="${sess.picture}" referrerpolicy="no-referrer"> `:'';
  const viaTag = sess.via==='google'?' <span class="utag">Google</span>':(sess.via==='github'?' <span class="utag">GitHub</span>':'');
  
  document.getElementById('whoami').innerHTML = av + (isAdmin ? '<b>파란이발 (btsky99)님</b>' : sess.name) + viaTag;
  document.getElementById('greet').textContent = (isAdmin ? '파란이발 (btsky99)' : sess.name) + ' 님, 안녕하세요! 👋';
  document.getElementById('greetSub').textContent = isAdmin ? '가입 신청한 사용자별로 허용할 5대 프로젝트 권한을 개별 선택하여 승인하세요.' : '승인 완료된 회원입니다. 부여된 파란이발 프로젝트 이용 권한을 확인하세요.';

  if (isAdmin) {
    renderAdminUsers();
  } else {
    const approvedMap = A.getApprovedMap();
    const myPerms = approvedMap[sess.id] || approvedMap[idStr] || A.PRODUCTS.map(p=>p.key);
    const permChips = A.PRODUCTS.map(p => {
      const has = myPerms.includes(p.key);
      return `<div class="my-perm-chip" style="opacity:${has?1:0.35}; background:${has?'rgba(37,99,235,0.2)':'rgba(255,255,255,0.03)'}">
        ${p.icon} ${p.name} ${has?'✅':'🔒'}</div>`;
    }).join('');

    document.getElementById('content').innerHTML =
      `<div class="welcome-box"><div class="ic">🎉</div><h3>승인된 회원 계정입니다</h3>
        <p>파란이발 관리자가 허용한 아래의 프로젝트 이용 권한을 확인하실 수 있습니다.</p>
        <div class="my-perms">${permChips}</div></div>`;
  }
}

// 관리자 — 사용자 승인 대기 목록 & 승인된 회원 프로젝트 권한 선택 UI
function renderAdminUsers(){
  const pend = A.getPending(), map = A.getApprovedMap(), approvedIds = Object.keys(map);
  const av = u => u.picture ? `<span class="uava"><img src="${u.picture}" referrerpolicy="no-referrer"></span>`
    : `<span class="uava">${(u.name||'?').slice(0,1)}</span>`;

  let html = `<div class="panel-box admin">
    <h3>
      <span>👑 파란이발 회원 & 프로젝트 권한 제어판</span>
      <span class="cnt">신청 ${pend.length}명 / 승인 ${approvedIds.length}명</span>
    </h3>`;

  html += `<div class="sub-h">⏳ 가입 승인 대기 신청자 (${pend.length})</div>`;
  if (pend.length) {
    html += pend.map(u => {
      const uidEsc = u.id.replace(/'/g, "\\'");
      return `
        <div class="user-card-box">
          <div class="user-head">
            ${av(u)}
            <div>
              <b>${u.name}</b> ${u.email ? `<span class="utag">${u.email}</span>` : ''}
              <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">신청시각: ${u.time || '최근'}</div>
            </div>
            <span class="utag">${u.via === 'google' ? 'Google' : (u.via === 'github' ? 'GitHub' : '소셜 계정')}</span>
          </div>
          
          <div style="font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px;">👇 허용할 프로젝트 선택:</div>
          <div class="perm-checks" id="perms_pend_${u.id}">
            ${A.PRODUCTS.map(p => `
              <label class="perm-label">
                <input type="checkbox" name="p_${u.id}" value="${p.key}" checked>
                ${p.icon} ${p.name}
              </label>
            `).join('')}
          </div>

          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn-approve" onclick="doApproveWithSelected('${uidEsc}')">✅ 선택 프로젝트 권한으로 승인</button>
          </div>
        </div>`;
    }).join('');
  } else {
    html += `<div class="none-msg">현재 승인 대기 중인 회원 가입 신청이 없습니다.</div>`;
  }

  html += `<div class="sub-h">✅ 승인 완료된 회원 목록 (${approvedIds.length})</div>`;
  if (approvedIds.length) {
    html += approvedIds.map(id => {
      const currentPerms = map[id] || [];
      const idEsc = id.replace(/'/g, "\\'");
      return `
        <div class="user-card-box">
          <div class="user-head">
            <span class="uava">${id.slice(0, 1)}</span>
            <b>${id}</b>
            <span class="utag" style="color:#34d399; border-color:rgba(52,211,153,0.3);">승인 상태</span>
            <div style="flex:1"></div>
            <button class="btn-revoke" onclick="doRevoke('${idEsc}')">권한 전면 해제</button>
          </div>

          <div style="font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px;">👇 허용된 프로젝트 (수정 가능):</div>
          <div class="perm-checks" id="perms_appr_${id}">
            ${A.PRODUCTS.map(p => {
              const isChecked = currentPerms.includes(p.key) ? 'checked' : '';
              return `
                <label class="perm-label">
                  <input type="checkbox" name="p_${id}" value="${p.key}" ${isChecked} onchange="updateUserPerms('${idEsc}')">
                  ${p.icon} ${p.name}
                </label>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');
  } else {
    html += `<div class="none-msg">아직 승인된 일반 회원이 없습니다.</div>`;
  }

  html += `
    <div style="margin-top:24px; padding:14px; background:rgba(255,255,255,0.03); border:1px dashed var(--line); border-radius:12px; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:13px; color:var(--muted);">💡 테스트 도구: 소셜 계정 테스트용 가입 신청서를 등록할 수 있습니다.</span>
      <button class="btn line" style="padding:4px 12px; font-size:12px;" onclick="addTestPending()">🧪 테스트 가입 신청 등록</button>
    </div>
  </div>`;

  document.getElementById('content').innerHTML = html;
}

function doApproveWithSelected(id) {
  const checkboxes = document.querySelectorAll(`input[name="p_${id}"]:checked`);
  const selected = Array.from(checkboxes).map(c => c.value);
  A.approveUserWithPerms(id, selected);
  renderAdminUsers();
}

function updateUserPerms(id) {
  const checkboxes = document.querySelectorAll(`input[name="p_${id}"]:checked`);
  const selected = Array.from(checkboxes).map(c => c.value);
  A.approveUserWithPerms(id, selected);
}

function doRevoke(id){ A.revokeId(id); renderAdminUsers(); }

function addTestPending() {
  const name = prompt('테스트 가입 신청자 이름을 입력하세요:', '홍길동');
  if (name) {
    const testUser = {
      id: 'test_' + Date.now(),
      name: name + ' 님',
      email: name.toLowerCase() + '@example.com',
      via: 'google',
      picture: ''
    };
    A.addPending(testUser);
    renderAdminUsers();
  }
}

const sess = A.AUTH.current();
if (sess) enter(sess); else location.href='../';
</script>
</body>
</html>
