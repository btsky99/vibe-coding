<!DOCTYPE html>
<!--
  FILE: web/portal/index.html
  DESCRIPTION: btsky.pe.kr 프로젝트 관리 포털 — 로그인 프로토타입.
    로그인 3종: (1)관리자 데모 (2)일반 데모 (3)Google 로그인(OAuth, GIS).
    [정적 호스팅] GitHub Pages라 서버 없음. Google 로그인은 Google Identity Services로
    클라이언트에서 처리 — 구글이 서명한 ID 토큰(JWT)을 받아 이메일/이름을 확인한다.
    실보안(토큰 서버검증·세션·RLS)은 백엔드 필요 → [SUPABASE 승격 지점] 참고.
    [보안] 데모 비번은 노출된 더미값. 실계정 자격증명·시크릿 절대 하드코딩 금지
    (Google은 client_id만 공개값이라 OK — client_secret은 여기 쓰지 않는다).
  REVISION HISTORY:
    - 2026-07-22 Claude: 최초 프로토타입 — 관리자/일반 뷰 분리.
    - 2026-07-22 Claude: Google 로그인(GIS) 추가 — 이메일 allowlist로 역할 자동배정.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브 코딩 — 프로젝트 관리 포털</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0b0d10; --card:#14171c; --card2:#1a1e24; --line:#252b33; --fg:#e6e9ee;
    --muted:#8b93a1; --accent:#3ba55d; --accent2:#2d7d46; --amber:#e0a83b; --red:#e0574b;
    --shadow:0 8px 32px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f9; --card:#ffffff; --card2:#f7f9fb; --line:#e2e6ec; --fg:#1a1d22;
           --muted:#5a6472; --shadow:0 8px 32px rgba(0,0,0,.08); }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif; font-size:14px; }
  .proto{ background:var(--amber); color:#1a1d22; text-align:center; font-size:12px;
    font-weight:600; padding:6px 12px; }
  #login{ min-height:calc(100vh - 30px); display:flex; align-items:center; justify-content:center; padding:24px; }
  .lcard{ background:var(--card); border:1px solid var(--line); border-radius:20px;
    box-shadow:var(--shadow); padding:40px 36px; max-width:400px; width:100%; }
  .logo{ font-size:44px; text-align:center; margin-bottom:12px; }
  h1{ font-size:22px; font-weight:800; text-align:center; letter-spacing:-.02em; }
  .sub{ color:var(--muted); font-size:13px; text-align:center; margin:6px 0 24px; }
  label{ display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--fg); font-size:14px; }
  input:focus{ outline:none; border-color:var(--accent); }
  .btn{ width:100%; margin-top:20px; padding:13px; border:none; border-radius:11px; color:#fff;
    background:linear-gradient(180deg,var(--accent),var(--accent2)); font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .1s, box-shadow .1s; box-shadow:0 4px 14px rgba(59,165,93,.3); }
  .btn:hover{ transform:translateY(-1px); }
  .err{ color:var(--red); font-size:12px; margin-top:12px; text-align:center; min-height:16px; }
  .demo{ margin-top:22px; padding:12px; border:1px dashed var(--line); border-radius:10px;
    font-size:12px; color:var(--muted); line-height:1.7; }
  .demo b{ color:var(--fg); }
  /* 구분선 "또는" */
  .divider{ display:flex; align-items:center; gap:12px; margin:22px 0 18px; color:var(--muted); font-size:12px; }
  .divider::before,.divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  /* 구글 버튼 영역 */
  #gwrap{ display:flex; justify-content:center; min-height:44px; }
  .gnote{ margin-top:10px; font-size:11px; color:var(--amber); text-align:center; line-height:1.6; }
  #app{ display:none; }
  .top{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px;
    border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
  .top .brand{ font-weight:800; display:flex; align-items:center; gap:8px; }
  .role{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .role.admin{ background:rgba(224,168,59,.15); color:var(--amber); border:1px solid rgba(224,168,59,.4); }
  .role.user{ background:rgba(59,165,93,.15); color:var(--accent); border:1px solid rgba(59,165,93,.4); }
  .top-right{ display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted); }
  .avatar{ width:26px; height:26px; border-radius:50%; vertical-align:middle; }
  .logout{ background:none; border:1px solid var(--line); color:var(--muted); padding:6px 12px;
    border-radius:8px; cursor:pointer; font-size:12px; }
  .logout:hover{ color:var(--fg); border-color:var(--muted); }
  .wrap{ max-width:1000px; margin:0 auto; padding:28px 24px; }
  .hi{ font-size:20px; font-weight:800; margin-bottom:4px; }
  .hi-sub{ color:var(--muted); margin-bottom:24px; }
  .stats{ display:flex; gap:14px; margin-bottom:26px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:140px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:16px 18px; }
  .stat .n{ font-size:26px; font-weight:800; }
  .stat .l{ font-size:12px; color:var(--muted); margin-top:2px; }
  .sect-h{ font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin:8px 0 12px; }
  .plist{ display:flex; flex-direction:column; gap:10px; }
  .empty{ color:var(--muted); padding:24px; text-align:center; border:1px dashed var(--line); border-radius:14px; }
  .proj{ background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; display:flex; align-items:center; gap:16px; }
  .proj .pname{ font-weight:700; }
  .proj .powner{ font-size:12px; color:var(--muted); margin-top:2px; }
  .proj .grow{ flex:1; }
  .badge{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .b-active{ background:rgba(59,165,93,.15); color:var(--accent); }
  .b-hold{ background:rgba(224,168,59,.15); color:var(--amber); }
  .b-done{ background:rgba(139,147,161,.15); color:var(--muted); }
  .bar{ width:120px; height:7px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar>i{ display:block; height:100%; background:var(--accent); }
  .adminbox{ margin-top:30px; background:var(--card); border:1px solid rgba(224,168,59,.3);
    border-radius:14px; padding:18px; }
  .adminbox h3{ font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
  .urow{ display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .urow:first-of-type{ border-top:none; }
  .utag{ font-size:11px; padding:2px 8px; border-radius:6px; background:var(--card2); color:var(--muted); }
</style>
</head>
<body>
  <div class="proto">🧪 프로토타입 — 실제 서버 인증/DB 미연동 (Supabase 연동 시 실사용 승격). 데모 계정 또는 Google로 로그인해 보세요.</div>

  <!-- 로그인 -->
  <div id="login">
    <form class="lcard" onsubmit="return doLogin(event)">
      <div class="logo">🗂️</div>
      <h1>프로젝트 관리 포털</h1>
      <p class="sub">바이브 코딩 · 통합 관리</p>
      <label for="uid">아이디</label>
      <input id="uid" autocomplete="username" placeholder="admin 또는 user">
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button class="btn" type="submit">로그인</button>
      <div class="err" id="err"></div>

      <div class="divider">또는</div>
      <div id="gwrap"></div>
      <div class="gnote" id="gnote"></div>

      <div class="demo">
        <b>데모 계정</b> (프로토타입 — 실제 비번 아님)<br>
        · 관리자: <b>admin</b> / <b>admin123</b> → 모든 프로젝트<br>
        · 일반: <b>user</b> / <b>user123</b> → 본인 프로젝트만<br>
        · Google: 로그인한 이메일이 관리자 목록에 있으면 관리자
      </div>
    </form>
  </div>

  <!-- 앱 -->
  <div id="app">
    <div class="top">
      <div class="brand">🗂️ 프로젝트 관리 포털 <span class="role" id="roleBadge"></span></div>
      <div class="top-right">
        <span id="whoami"></span>
        <button class="logout" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="wrap">
      <div class="hi" id="greet"></div>
      <div class="hi-sub" id="greetSub"></div>
      <div class="stats" id="stats"></div>
      <div class="sect-h">프로젝트</div>
      <div class="plist" id="plist"></div>
      <div class="adminbox" id="adminbox" style="display:none">
        <h3>👑 사용자 관리 <span style="font-weight:400;color:var(--muted);font-size:12px">(관리자 전용)</span></h3>
        <div id="ulist"></div>
      </div>
    </div>
  </div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// [설정] ──────────────────────────────────────────────────────────────────────
// Google OAuth 클라이언트 ID. Google Cloud Console에서 발급 후 여기 교체.
//   (승인된 JavaScript 원본에 https://btsky.pe.kr, https://btsky99.github.io 등록 필수)
// client_id는 공개값이라 여기 둬도 안전. client_secret은 정적 사이트에 절대 두지 않는다.
const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
// 이 이메일들은 Google 로그인 시 '관리자' 역할. 나머지는 '일반'.
const ADMIN_EMAILS = ['btsky99@gmail.com'];

// [SUPABASE 승격 지점 ①] 데모 인증 — 실사용 시 supabase.auth로 교체.
const USERS = {
  admin: { pw:'admin123', role:'admin', name:'관리자' },
  user:  { pw:'user123',  role:'user',  name:'유진수' },
};
const AUTH = {
  login(id, pw){
    const u = USERS[id];
    if (u && u.pw === pw){ const s={id, role:u.role, name:u.name, via:'demo'};
      save(s); return s; }
    return null;
  },
  // Google ID 토큰(JWT) 프로필로 세션 생성. 역할은 이메일 allowlist로 결정.
  loginGoogle(profile){
    const role = ADMIN_EMAILS.includes((profile.email||'').toLowerCase()) ? 'admin' : 'user';
    const s = { id:profile.email, email:profile.email, name:profile.name||profile.email,
                picture:profile.picture||'', role, via:'google' };
    save(s); return s;
  },
  current(){ try { return JSON.parse(localStorage.getItem('portal_sess')||'null'); } catch { return null; } },
  logout(){ localStorage.removeItem('portal_sess'); },
};
function save(s){ localStorage.setItem('portal_sess', JSON.stringify(s)); }

// [SUPABASE 승격 지점 ②] 데이터 — 실사용 시 supabase.from('projects').select() + RLS.
const PROJECTS = [
  { name:'vibe-coding',  owner:'유진수', status:'active', progress:82 },
  { name:'파인드라이브 자동화', owner:'유진수', status:'hold',   progress:15 },
  { name:'다운로드 포털',  owner:'유진수', status:'active', progress:95 },
  { name:'하이브 대시보드', owner:'관리자', status:'active', progress:60 },
  { name:'맥 포팅',       owner:'관리자', status:'hold',   progress:5  },
  { name:'제텔카스텐 정리', owner:'관리자', status:'done',   progress:100 },
];
function fetchProjects(sess){
  return sess.role === 'admin' ? PROJECTS : PROJECTS.filter(p => p.owner === sess.name);
}

const S = { active:{t:'진행중',c:'b-active'}, hold:{t:'보류',c:'b-hold'}, done:{t:'완료',c:'b-done'} };

// ── Google Identity Services 초기화 ──
function initGoogle(){
  const note = document.getElementById('gnote');
  if (GOOGLE_CLIENT_ID.startsWith('YOUR_')){
    note.textContent = '⚙️ Google 로그인을 쓰려면 GOOGLE_CLIENT_ID 설정이 필요합니다 (발급 후 자동 활성화).';
    return;
  }
  if (!window.google || !google.accounts || !google.accounts.id){ setTimeout(initGoogle, 300); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle });
  google.accounts.id.renderButton(document.getElementById('gwrap'),
    { theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'ko', width:328 });
}
function onGoogle(resp){
  try {
    const profile = decodeJwt(resp.credential); // {email, name, picture, ...}
    render(AUTH.loginGoogle(profile));
  } catch(e){ document.getElementById('err').textContent = 'Google 로그인 처리 실패: ' + e.message; }
}
// JWT payload(base64url) 디코드 — 클라이언트에서 신원 표시용(서버검증은 백엔드 승격 시).
function decodeJwt(token){
  const b = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const json = decodeURIComponent(atob(b).split('').map(c =>
    '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}

function doLogin(e){
  e.preventDefault();
  const id = document.getElementById('uid').value.trim();
  const pw = document.getElementById('pw').value;
  const sess = AUTH.login(id, pw);
  if (!sess){ document.getElementById('err').textContent = '아이디 또는 비밀번호가 올바르지 않습니다.'; return false; }
  render(sess);
  return false;
}
function logout(){ AUTH.logout(); document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('uid').value=''; document.getElementById('pw').value=''; document.getElementById('err').textContent='';
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); }

function render(sess){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  const isAdmin = sess.role==='admin';
  const rb = document.getElementById('roleBadge');
  rb.textContent = isAdmin ? '관리자' : '일반';
  rb.className = 'role ' + (isAdmin?'admin':'user');
  const av = sess.picture ? `<img class="avatar" src="${sess.picture}" referrerpolicy="no-referrer"> ` : '';
  const gtag = sess.via==='google' ? ' <span class="utag">Google</span>' : '';
  document.getElementById('whoami').innerHTML = av + sess.name + ' 님' + gtag;
  document.getElementById('greet').textContent = sess.name + ' 님, 안녕하세요 👋';
  document.getElementById('greetSub').textContent = isAdmin
    ? '전체 프로젝트를 관리할 수 있습니다.' : '내가 담당하는 프로젝트입니다.';

  const list = fetchProjects(sess);
  const active = list.filter(p=>p.status==='active').length;
  const done = list.filter(p=>p.status==='done').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${list.length}</div><div class="l">${isAdmin?'전체':'내'} 프로젝트</div></div>
    <div class="stat"><div class="n" style="color:var(--accent)">${active}</div><div class="l">진행중</div></div>
    <div class="stat"><div class="n" style="color:var(--muted)">${done}</div><div class="l">완료</div></div>`;
  document.getElementById('plist').innerHTML = list.length ? list.map(p=>{
    const s = S[p.status];
    return `<div class="proj">
      <div><div class="pname">${p.name}</div><div class="powner">담당: ${p.owner}</div></div>
      <div class="grow"></div>
      <div class="bar"><i style="width:${p.progress}%"></i></div>
      <span style="font-size:12px;color:var(--muted);width:34px;text-align:right">${p.progress}%</span>
      <span class="badge ${s.c}">${s.t}</span>
    </div>`; }).join('') : '<div class="empty">담당 중인 프로젝트가 없습니다.</div>';
  const ab = document.getElementById('adminbox');
  if (isAdmin){
    ab.style.display='block';
    document.getElementById('ulist').innerHTML = Object.entries(USERS).map(([id,u])=>`
      <div class="urow"><b>${u.name}</b><span class="utag">${id}</span>
        <span class="utag">${u.role==='admin'?'관리자':'일반'}</span>
        <div style="flex:1"></div>
        <span style="color:var(--muted);font-size:12px">${PROJECTS.filter(p=>p.owner===u.name).length}개 담당</span>
      </div>`).join('');
  } else { ab.style.display='none'; }
}

// 세션 유지 + 구글 버튼 초기화
const existing = AUTH.current();
if (existing) render(existing);
initGoogle();
</script>
</body>
</html>
