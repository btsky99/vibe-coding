<!DOCTYPE html>
<!--
  FILE: web/index.html
  DESCRIPTION: btsky.pe.kr 다운로드 랜딩 페이지 (A안 — 안내 페이지). GitHub Pages 루트로 게시.
    GitHub Releases API에서 최신 setup.exe를 런타임에 자동으로 물어와 버튼에 건다.
    자동 업데이트는 여전히 GitHub이 담당하고, 이 페이지는 '현관문' 역할만 한다.
    자체 완결(외부 CSS/JS 없음) — 어떤 정적 호스팅에 올려도 그대로 동작.
  REVISION HISTORY:
    - 2026-07-22 Claude: 최초 생성 — REPO 상수만 바꾸면 타 프로젝트 재사용 가능.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브 코딩 — 다운로드</title>
<style>
  :root{
    --bg:#0b0d10; --card:#14171c; --line:#232830; --fg:#e6e9ee; --muted:#8b93a1;
    --accent:#3ba55d; --accent2:#2d7d46; --shadow:0 8px 32px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f9; --card:#ffffff; --line:#e2e6ec; --fg:#1a1d22; --muted:#5a6472;
           --shadow:0 8px 32px rgba(0,0,0,.08); }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:radial-gradient(circle at 50% 0%, rgba(59,165,93,.08), transparent 60%);
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    box-shadow:var(--shadow); padding:48px 40px; max-width:520px; width:100%; text-align:center;
  }
  .logo{ font-size:52px; line-height:1; margin-bottom:16px; }
  h1{ font-size:26px; font-weight:800; letter-spacing:-.02em; margin-bottom:6px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:28px; }
  .ver{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);
    background:rgba(59,165,93,.1); border:1px solid rgba(59,165,93,.25);
    padding:5px 12px; border-radius:999px; margin-bottom:24px;
  }
  .ver b{ color:var(--accent); font-weight:700; }
  .btn{
    display:block; width:100%; text-decoration:none; color:#fff;
    background:linear-gradient(180deg,var(--accent),var(--accent2));
    padding:16px; border-radius:14px; font-size:16px; font-weight:700;
    transition:transform .12s ease, box-shadow .12s ease; box-shadow:0 4px 16px rgba(59,165,93,.3);
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(59,165,93,.4); }
  .btn:active{ transform:translateY(0); }
  .btn small{ display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:3px; }
  .btn[aria-disabled="true"]{ pointer-events:none; opacity:.55; filter:grayscale(.4); }
  .meta{ margin-top:14px; font-size:12px; color:var(--muted); }
  .os-row{ display:flex; gap:12px; margin-top:20px; }
  .os-row .btn{ flex:1; }
  .btn.ghost{
    background:transparent; color:var(--muted); border:1px dashed var(--line);
    box-shadow:none; cursor:default;
  }
  .btn.ghost:hover{ transform:none; box-shadow:none; }
  .foot{ margin-top:28px; font-size:12px; color:var(--muted); }
  .foot a{ color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">🌊</div>
    <h1>바이브 코딩</h1>
    <p class="sub">AI 멀티 에이전트 하이브 마인드 개발 대시보드</p>

    <div class="ver" id="ver">최신 버전 확인 중…</div>

    <div class="os-row">
      <a class="btn" id="winBtn" href="#" aria-disabled="true">
        🪟 Windows 설치
        <small id="winSize">준비 중…</small>
      </a>
      <a class="btn ghost" aria-disabled="true">
        🍎 macOS
        <small>준비 중</small>
      </a>
    </div>

    <p class="meta" id="meta">Windows 10/11 · 설치 후 자동 업데이트</p>

    <p class="foot">
      릴리즈 노트 · 이전 버전 →
      <a id="allReleases" href="https://github.com/btsky99/vibe-coding/releases" target="_blank" rel="noopener">전체 릴리즈</a>
    </p>
  </main>

<script>
// [설정] 다른 프로젝트에 재사용 시 REPO만 교체.
const REPO = 'btsky99/vibe-coding';

function fmtSize(bytes){
  if(!bytes) return '';
  const mb = bytes/1024/1024;
  return mb >= 1 ? mb.toFixed(1)+' MB' : (bytes/1024).toFixed(0)+' KB';
}

// GitHub Releases API로 최신 릴리즈의 setup.exe 자산을 런타임 조회 → 버전 안 바뀌어도 항상 최신.
fetch(`https://api.github.com/repos/${REPO}/releases/latest`, {
  headers: { 'Accept': 'application/vnd.github+json' }
})
.then(r => { if(!r.ok) throw new Error('release fetch failed'); return r.json(); })
.then(rel => {
  const tag = rel.tag_name || rel.name || '';
  document.getElementById('ver').innerHTML = `현재 최신 버전 <b>${tag}</b>`;

  const assets = rel.assets || [];
  // setup(인스톨러) 우선, 없으면 update(GUI EXE) 폴백
  const win = assets.find(a => /setup.*\.exe$/i.test(a.name))
           || assets.find(a => /update.*\.exe$/i.test(a.name))
           || assets.find(a => /\.exe$/i.test(a.name));

  const btn = document.getElementById('winBtn');
  if (win) {
    btn.href = win.browser_download_url;
    btn.removeAttribute('aria-disabled');
    document.getElementById('winSize').textContent = fmtSize(win.size) + ' · 설치 프로그램';
    document.getElementById('meta').textContent =
      `Windows 10/11 · ${win.name} · 설치 후 자동 업데이트`;
  } else {
    document.getElementById('winSize').textContent = '설치 파일 없음';
  }
})
.catch(() => {
  document.getElementById('ver').textContent = '버전 정보를 불러오지 못했어요';
  const btn = document.getElementById('winBtn');
  // 폴백: GitHub 릴리즈 페이지로 직접 이동
  btn.href = `https://github.com/${REPO}/releases/latest`;
  btn.removeAttribute('aria-disabled');
  document.getElementById('winSize').textContent = 'GitHub에서 받기';
});
</script>
</body>
</html>
